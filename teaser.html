const icons={home:'<path d="m3 10 9-7 9 7v10H3Z"/><path d="M9 20v-7h6v7"/>',heart:'<path d="M20.5 4.5c-3-3-6.5-1-8.5 1-2-2-5.5-4-8.5-1S2 12 12 21C22 12 23.5 7.5 20.5 4.5Z"/>',chat:'<path d="M21 11a9 9 0 0 1-9 9H4l-2 2v-9A9 9 0 1 1 21 11Z"/><path d="M7 10h10M7 14h6"/>',chart:'<path d="M4 20V4M4 20h17M8 15l4-6 4 3 5-8"/>',spark:'<path d="m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5ZM20 2v4M18 4h4"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="m9 3-1 3-3 1-2 3 2 3v4l3 2 3-1 3 2 3-2v-3l3-2-1-4-3-1-1-3Z"/>',moon:'<path d="M20 14A9 9 0 0 1 10 3a9 9 0 1 0 10 11Z"/>',lock:'<rect x="5" y="10" width="14" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/>',bell:'<path d="M5 17h14l-2-4V9a5 5 0 0 0-10 0v4ZM10 21h4"/>',arrow:'<path d="M4 12h16m-6-6 6 6-6 6"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1 1M18 18l1 1M5 19l1-1M18 6l1-1"/>'};

function toast(msg){$('#toast').textContent=msg;$('#toast').classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('#toast').classList.remove('show'),3000)}
function brand(){return '<a class="brand" href="#today" aria-label="SAI 홈"><span class="brandmark"></span>sai<span style="font-size:22px;color:#8e9e79">.</span><small>사이</small></a>'}
const navs=[['today','home','우리의 오늘','ふたりの今日'],['chat','chat','둘만의 대화','ふたりのトーク'],['health','chart','바디 다이어리','からだ日記'],['play','spark','우리의 놀이터','ふたりの遊び場'],['settings','settings','공유와 설정','共有と設定']];
function render(){stopInteraction();document.documentElement.lang=lang;const hash=location.hash.slice(1)||(document.body?.dataset.entry==='teaser'?'teaser':'today');state.view=navs.some(n=>n[0]===hash)?hash:'today';$('#root').innerHTML=hash==='teaser'?landing():shell();bind();}
function shell(){return `<div class="layout"><aside class="sidebar">${brand()}<p class="tagline">A LITTLE CLOSER, EVERY DAY.</p><nav class="nav" aria-label="${t('앱 메뉴','アプリメニュー')}">${navs.map(n=>`<button data-view="${n[0]}" class="${state.view===n[0]?'active':''}" ${state.view===n[0]?'aria-current="page"':''}>${icon(n[1])}${t(n[2],n[3])}${n[0]==='chat'?'<span class="dot"></span>':''}</button>`).join('')}</nav><div class="side-bottom"><button class="ring-status wide" data-action="ring"><span class="ring-mini"></span><span><strong>${t('나의 사이 링','わたしの SAI Ring')}</strong><p>● ${t('연결됨 · 배터리 82%','接続済み · バッテリー82%')}</p></span></button><a class="teaser-link" href="#teaser">${t('사이를 처음 만나보세요','SAIについて知る')} ↗</a></div></aside><main class="main"><header class="topbar"><a href="pair.html" target="_top">${t('두 화면으로 함께 체험하기 ↗','2画面で一緒に体験する ↗')}</a><div class="topright"><button data-action="language" aria-label="언어 변경">${lang==='ko'?'KR':'JP'} ⌄</button><span class="pill"><i></i>${t('지우와 함께한 128일','ジウと一緒に128日')}</span><button data-action="notifications" aria-label="${t('알림','通知')}">${icon('bell')}</button><span class="avatar">🌱</span></div></header>${content()}<footer class="bottomline"><span>${icon('lock')}${t('서로가 허락한 만큼, 편안하게 연결돼요.','お互いが選んだ分だけ、心地よくつながる。')}</span><span>SAI CONCEPT · ${t('모든 데이터는 예시입니다','すべてサンプルデータです')}</span></footer></main></div>`}

function modal(html){stopInteraction();$('#modal').innerHTML=`<button class="close" data-close aria-label="${t('닫기','閉じる')}">×</button>${html}`;$('#modal').showModal();$('#modal').querySelector('[data-close]').onclick=()=>$('#modal').close()}
function game(){modal(`<span class="eyebrow">JUST FOR FUN · DEMO</span><h2>${t('처음 만난 날,<br>내가 먼저 마음에 들었어?','初めて会った日、<br>先に好きになったのは私？')}</h2><div class="heartbeat">♡</div><p style="text-align:center">${t('서로 동의했다면, 질문에 답하며 시작해요.','お互いに同意したら、質問に答えてスタート。')}</p><button class="primary wide" id="start-game">${t('둘 다 동의하고 데모 시작','ふたりで同意してデモ開始')}</button><p class="legal">${t('심박수로 거짓말이나 감정을 알 수 없어요. 실제 링 연결 없이 예시 결과를 보여줍니다.','心拍で嘘や感情はわかりません。実際のリング接続なしでサンプル結果を表示します。')}</p>`);$('#start-game').onclick=()=>{$('#modal').close();modal(`<span class="eyebrow">OUR LITTLE MOMENT</span><h2>${t('이 질문에, 조금 두근했네.','この質問に、ちょっとドキドキ。')}</h2><div class="reading">72 → 86 <small style="font-size:13px">bpm</small></div><p>${t('예시 심박 변화 +14 bpm. 이 두근거림의 의미는 서로에게 물어보세요.','サンプル心拍変化 +14 bpm。このドキドキの意味は、お互いに聞いてみよう。')}</p><p class="legal">${t('미리 정해진 시연 수치입니다. 진실·거짓 판정이 아닙니다.','あらかじめ設定されたデモ数値です。真偽の判定ではありません。')}</p><button class="primary wide" id="share-game">${t('이 순간을 대화에 남기기','この瞬間をトークに残す')} ↗</button>`);$('#share-game').onclick=()=>{state.messages.push(t('♡ 두근두근 질문: 처음 만난 날, 내가 먼저 마음에 들었어?\n예시 심박 72 → 86 bpm. 이 두근거림은 무슨 뜻이야?','♡ ドキドキ質問：初めて会った日、先に好きになったのは私？\nサンプル心拍72 → 86 bpm。このドキドキの意味は？'));persist();$('#modal').close();location.hash='chat'}}}
function signup(preferred){modal(`<span class="eyebrow">HELLO, OUR FIRST CHAPTER</span><h2>${t('우리의 사이, 먼저 만나기','ふたりのSAIに、いち早く出会う')}</h2><p>${t('어떤 사이를 기대하시나요?<br>사전 신청 흐름을 미리 체험해보세요.','どんなSAIを楽しみにしていますか？<br>事前登録の流れを体験してみてください。')}</p><form id="signup-form"><label class="form-field">${t('이메일','メールアドレス')}<input type="email" name="email" required maxlength="254" placeholder="you@example.com"></label><label class="form-field">${t('거주 국가','お住まいの国')}<select name="country"><option value="KR">${t('한국','韓国')}</option><option value="JP" ${lang==='ja'?'selected':''}>${t('일본','日本')}</option><option value="other">${t('그 외','その他')}</option></select></label><label class="form-field">${t('가장 기대되는 기능','いちばん楽しみな機能')}<select name="feature"><option value="checkin">${t('아침 체크인 & 컨디션 공유','朝のチェックイン＆体調共有')}</option>${teaserFeatures().map(([key,i,title])=>`<option value="${key}">${title}</option>`).join('')}<option value="cycle">${t('생리 주기 예상 & 선택 공유','生理周期の予測＆選択共有')}</option><option value="chat">${t('둘만의 대화','ふたりのトーク')}</option></select></label><label class="form-field">${t('커플 분석 구독에 지불할 수 있는 월 금액','カップル分析サブスクの月額予算')}<select name="budget"><option value="undecided">${t('아직 잘 모르겠어요','まだわからない')}</option><option value="low">${t('월 5,000원 미만','月500円未満')}</option><option value="mid">${t('월 5,000~10,000원','月500〜1,000円')}</option><option value="high">${t('월 10,000원 이상','月1,000円以上')}</option></select></label><label class="consent"><input type="checkbox" required>${t('목업 체험임을 확인했습니다. 이메일은 저장·전송하지 않고, 선택한 응답만 이 브라우저에 저장합니다.','モックアップ体験であることを確認しました。メールは保存・送信せず、選んだ回答のみこのブラウザに保存します。')}</label><button class="primary wide" type="submit">${t('사전 신청 체험 완료하기','事前登録の体験を完了する')} ↗</button></form>`);if(preferred&&teaserFeatures().some(f=>f[0]===preferred))$('#signup-form select[name="feature"]').value=preferred;$('#signup-form').onsubmit=e=>{e.preventDefault();const fd=new FormData(e.target);state.interest={country:fd.get('country'),feature:fd.get('feature'),budget:fd.get('budget'),locale:lang};persist();$('#modal').close();modal(`<span class="eyebrow">THANK YOU, FROM SAI</span><h2>${t('당신이 기대하는 사이,<br>잘 들었어요.','あなたが楽しみにするSAI、<br>受け取りました。')}</h2><p>${t('사전 신청 체험을 완료했어요. 선택한 응답은 이 브라우저에만 저장했으며, 실제 출시 알림 신청은 이루어지지 않았습니다.','事前登録の体験が完了しました。回答はこのブラウザにのみ保存され、実際のリリース通知には登録されていません。')}</p><a href="pair.html" target="_top" class="primary wide" id="signup-to-app">${t('이제 우리의 하루 체험하기','ふたりの一日を体験する')} →</a>`);$('#signup-to-app').onclick=()=>$('#modal').close()}}
function bind(){document.querySelectorAll('[data-story]').forEach(b=>b.onclick=()=>{teaserStoryKey=b.dataset.story;$('#teaser-story').innerHTML=teaserStory();document.querySelectorAll('[data-story]').forEach(x=>{x.classList.toggle('selected',x===b);x.setAttribute('aria-pressed',String(x===b))})});document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>location.hash=b.dataset.view);document.querySelectorAll('[data-scroll]').forEach(a=>a.onclick=e=>{e.preventDefault();document.getElementById(a.dataset.scroll).scrollIntoView({behavior:'smooth'})});document.querySelectorAll('[data-mood]').forEach(b=>b.onclick=()=>{state.mood=Number(b.dataset.mood);document.querySelectorAll('[data-mood]').forEach(x=>{x.classList.toggle('selected',x===b);x.setAttribute('aria-pressed',x===b)})});document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>{state.sharing[b.dataset.toggle]=!state.sharing[b.dataset.toggle];persist();b.setAttribute('aria-checked',state.sharing[b.dataset.toggle]);toast(t('공유 설정을 저장했어요.','共有設定を保存しました。'))});document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action,b.dataset.interest));if($('#chat-form'))$('#chat-form').onsubmit=e=>{e.preventDefault();const val=$('#chat-input').value.trim();if(!val)return;state.messages.push(val);persist();render();$('#chat-input').focus();$('#chat-input').scrollIntoView({block:'nearest'})}}
function action(a,interest){if(a==='pulse')pulseDemo();if(a==='breathe')breatheDemo();if(a==='garden')sleepGarden();if(a==='language'){lang=lang==='ko'?'ja':'ko';try{sessionStorage.setItem('sai-lang',lang)}catch{}render()}if(a==='checkin'){state.checkin={mood:state.mood,note:$('#note').value.trim()};persist();render();toast(state.sharing.mood?t('오늘의 마음을 공유 카드에 담았어요.','今日の気持ちを共有カードに記録しました。'):t('나만의 마음 기록을 저장했어요.','自分だけの気持ちを保存しました。'))}if(a==='hug'){state.messages.push(t('♡ 말없이 꼬옥. 오늘은 조금 쉬어가도 괜찮아.','♡ ぎゅっとハグ。今日は少し休んでも大丈夫。'));persist();toast(t('대화에 마음 안아주기를 남겼어요. (체험)','トークにハグを残しました。（体験）'))}if(a==='goodnight'){state.messages.push(t('☾ 오늘 밤 11시, 같이 굿나잇 하자.','☾ 今夜11時、一緒におやすみしよう。'));persist();location.hash='chat'}if(a==='game')game();if(a==='signup')signup(interest);if(a==='ring')modal(`<span class="eyebrow">MY SAI RING</span><h2>${t('나의 사이 링','わたしのSAI Ring')}</h2><p>${t('연결됨 · 배터리 82% · 마지막 동기화 08:45','接続済み · バッテリー82% · 最終同期08:45')}</p><p class="legal">${t('연결 상태는 시연용입니다. 이 목업은 Bluetooth나 제조사 SDK에 연결되어 있지 않습니다.','接続状態はデモです。このモックアップはBluetoothやメーカーSDKには接続していません。')}</p>`);if(a==='notifications')modal(`<span class="eyebrow">LITTLE UPDATES</span><h2>${t('도착한 마음','届いた気持ち')}</h2><div class="partner-bubble">🍑 ${t('지우가 아침 체크인을 남겼어요.','ジウが朝のチェックインを残しました。')}<small>08:42 · ${t('예시 알림','サンプル通知')}</small></div><p>${t('오늘은 일찍 만나서 쉬자','今日は早めに会ってゆっくりしよう')}</p>`);if(a==='cycle'){modal(`<span class="eyebrow">MY OWN RHYTHM</span><h2>${t('내 몸의 리듬','自分のからだのリズム')}</h2><p>${t('다음 생리 예상일 · 9월 14일 (예시)<br>예상 날짜는 달라질 수 있어요. 내 상태를 함께 기록해요.','次の生理予測日 · 9月14日（サンプル）<br>予測日は変動します。今の体調も記録しましょう。')}</p><label class="form-field">${t('오늘의 몸 상태','今日の体調')}<select id="cycle-symptom"><option>${t('특별한 변화 없어요','特に変化なし')}</option><option>${t('조금 피곤해요','少し疲れています')}</option><option>${t('배가 불편해요','お腹が気になります')}</option></select></label><button class="primary wide" id="save-cycle">${t('내 기록에 저장','自分の記録に保存')}</button><p class="legal">${t('증상 메모는 나만 볼 수 있습니다. 예상일은 진단·피임용이 아닙니다.','症状メモは自分だけに表示。予測日は診断・避妊用ではありません。')}</p>`);if(state.symptom){const opt=[...$('#cycle-symptom').options].find(o=>o.value===state.symptom);if(opt)opt.selected=true}$('#save-cycle').onclick=()=>{state.symptom=$('#cycle-symptom').value;persist();$('#modal').close();toast(t('나만의 리듬 기록을 저장했어요.','自分のリズムを記録しました。'))}}if(a==='preview'){const rows=[['mood',t('기분과 한마디','気分とひとこと'),state.checkin?`${t(['많이 지쳐요','조금 흐려요','평온해요','기분 좋아요','완전 신나요'],['くたくた','少し曇り','穏やか','いい気分','最高'])[state.checkin.mood]} · ${esc(state.checkin.note)}`:t('아직 체크인하지 않았어요','まだチェックインしていません')],['sleep',t('수면 요약','睡眠のまとめ'),'7h 42m · 86'],['heart',t('안정 시 심박','安静時心拍数'),'58 bpm'],['cycle',t('생리 주기 예상','生理周期の予測'),'D−6']];modal(`<span class="eyebrow">PARTNER PREVIEW</span><h2>${t('지우에게 보이는 내 정보','ジウに見える自分の情報')}</h2>${rows.filter(r=>state.sharing[r[0]]).map(r=>`<div class="partner-bubble"><small>${r[1]}</small>${r[2]}</div>`).join('')||`<p>${t('현재 공유하는 정보가 없어요.','現在共有している情報はありません。')}</p>`}<p class="legal">${t('내가 선택한 정보만 표시한 미리보기입니다.','自分が選んだ情報だけを表示したプレビューです。')}</p>`)}}
// Data interactions are local simulations. They never create chat messages.
let interactionTimer=null;
function stopInteraction(){if(interactionTimer!==null){clearInterval(interactionTimer);interactionTimer=null}}
function dataEntry(){return `<button class="data-entry" data-view="play"><span class="data-entry-orbits">◯<i>◯</i></span><span><small>CONNECTED WITHOUT WORDS</small><strong>${t('말 없이도, 우리 리듬이 닿도록','言葉がなくても、ふたりのリズムが届く')}</strong><em>${t('심박 보내기 · 함께 호흡 · 수면 정원','心拍を届ける · 一緒に呼吸 · 睡眠ガーデン')}</em></span><b>↗</b></button>`}
function play(){return `${intro('FEEL US, WITHOUT A WORD',t('말 없이 연결되는 우리','言葉なしでつながるふたり'),t('내 심박이 빛이 되고, 우리의 쉼이 꽃이 되는 곳.','心拍が光になり、ふたりの休息が花になる場所。'))}<section class="card rhythm-hero"><div class="card-head"><span class="eyebrow">01 / HEARTBEAT TOUCH</span><span class="simulation-tag">${t('데이터 체험','データ体験')}</span></div><div class="pulse-art"><span class="pulse-wave"></span><span class="pulse-wave second-wave"></span><span class="pulse-core">♡</span></div><h2>${t('지금의 나를, 톡.','今のわたしを、トン。')}</h2><p>${t('내 심박 리듬이 지우의 화면에 빛으로 번져요.<br>설명 없이 건네는, 나만의 작은 신호.','わたしの心拍リズムがジウの画面で光に。<br>言葉のいらない、わたしだけの小さな合図。')}</p><button class="primary wide" data-action="pulse">${t('내 심박 리듬 보내보기','心拍リズムを届けてみる')} ↗</button>${state.pulseSent?`<small class="data-receipt">${t('마지막 체험','前回の体験')} · ${state.pulseSent.bpm} bpm · ${t('빛으로 전달','光でお届け')}</small>`:''}</section><div class="data-grid"><section class="card breath-card"><span class="eyebrow">02 / BREATHE TOGETHER</span><div class="mini-breath"><i></i><i></i></div><h3>${t('잠깐, 같은 속도로','少しだけ、同じペースで')}</h3><p>${t('각자의 화면에서 같은 호흡 원을 따라가요. 바쁜 하루 사이, 둘이 함께 쉬는 24초.','それぞれの画面で同じ呼吸の円を追う。忙しい日常に、ふたりで休む24秒。')}</p><button class="secondary wide" data-action="breathe">${t('둘이 호흡 맞추기','ふたりで呼吸を合わせる')} →</button><small class="data-receipt">${t('함께 마친 호흡','一緒に終えた呼吸')} ${state.breathSessions||0}${t('회 · 체험 기록','回 · 体験記録')}</small></section><section class="card garden-card"><span class="eyebrow">03 / OUR SLEEP GARDEN</span><div class="tiny-garden">${state.gardenClaimed?'✿':'♧'}<span>· · ·</span></div><h3>${t('잘 자면, 함께 피어나','よく眠ると、一緒に咲く')}</h3><p>${t('각자의 수면 목표가 두 장의 잎을 채워요. 둘 다 충분히 쉰 날, 우리 정원에 꽃 한 송이.','それぞれの睡眠目標が2枚の葉を満たす。ふたりとも休めた日に、庭に一輪の花。')}</p><button class="secondary wide" data-action="garden">${t('우리 수면 정원 열기','睡眠ガーデンを開く')} →</button><small class="data-receipt">${t('함께 피운 꽃','一緒に咲かせた花')} ${state.gardenClaimed?1:0}${t('송이 · 체험 기록','輪 · 体験記録')}</small></section></div><section class="card question-strip"><span>♡</span><div><h3>${t('질문 하나에도, 두근','質問ひとつにも、ドキドキ')}</h3><p>${t('심박 변화로 시작하는 둘만의 질문 놀이','心拍の変化から始まるふたりの質問ゲーム')}</p></div><button class="secondary" data-action="game">${t('열기','開く')} ↗</button></section><p class="legal">${t('모든 심박·수면·상대 참여는 시뮬레이션입니다. 빛은 이 화면에서 재생되며 링 진동이나 실제 전송은 없습니다. 호흡 가이드는 심박 동기화나 감정 일치를 측정하지 않습니다.','心拍・睡眠・相手の参加はすべてシミュレーションです。光はこの画面で再生され、リング振動や実際の送信はありません。呼吸ガイドは心拍の同期や感情の一致を測定しません。')}</p>`}
function pulseDemo(){stopInteraction();modal(`<span class="eyebrow">HEARTBEAT TOUCH · DEMO</span><h2>${t('내 심박이, 너에게 빛으로.','わたしの心拍が、あなたに光で。')}</h2><p>${t('오늘의 예시 리듬을 골라보세요. 선택한 속도 그대로 지우의 화면을 밝혀요.','サンプルのリズムを選んでください。その速さでジウの画面を照らします。')}</p><div class="rhythm-options" role="group" aria-label="${t('예시 심박 선택','サンプル心拍を選ぶ')}">${[60,78,96].map((v,i)=>`<button class="rhythm-option ${i===1?'selected':''}" aria-pressed="${i===1}" data-bpm="${v}">${v}<small>bpm</small></button>`).join('')}</div><div id="pulse-preview" class="pulse-preview" style="--pulse-time:${60/78}s"><span class="pulse-wave"></span><span class="pulse-core">♡</span></div><label class="consent"><input id="pulse-consent" type="checkbox">${t('이 심박 리듬 1건을 공유하는 체험에 동의해요. 지속적인 심박 공유 설정은 바뀌지 않아요.','この心拍リズム1件の共有体験に同意します。継続共有の設定は変わりません。')}</label><button class="primary wide" id="send-pulse" disabled>${t('이 리듬 보내기','このリズムを届ける')} ↗</button><p class="legal">${t('선택한 예시 심박이며 현재 측정값이 아닙니다.','選んだサンプル心拍で、現在の測定値ではありません。')}</p>`);let bpm=78;document.querySelectorAll('[data-bpm]').forEach(b=>b.onclick=()=>{bpm=Number(b.dataset.bpm);document.querySelectorAll('[data-bpm]').forEach(x=>{x.classList.toggle('selected',x===b);x.setAttribute('aria-pressed',String(x===b))});$('#pulse-preview').style.setProperty('--pulse-time',`${60/bpm}s`)});$('#pulse-consent').onchange=()=>{$('#send-pulse').disabled=!$('#pulse-consent').checked};$('#send-pulse').onclick=()=>{if(!$('#pulse-consent').checked)return;state.pulseSent={bpm};persist();$('#modal').close();render();modal(`<span class="eyebrow">JIWOO'S SCREEN · PREVIEW</span><h2>${t('지우에게는 이렇게 닿아요.','ジウには、こんなふうに届きます。')}</h2><div class="received-pulse" style="--pulse-time:${60/bpm}s"><div class="pulse-preview"><span class="pulse-wave"></span><span class="pulse-core">♡</span></div><strong>${t('수민의 리듬이 도착했어요','スミンのリズムが届きました')}</strong><small>${bpm} bpm · ${t('빛으로 재생 중','光で再生中')}</small></div><p>${t('문장 대신, 지금의 리듬 하나. 상대방이 보는 화면의 로컬 미리보기예요.','文章のかわりに、今のリズムひとつ。相手側の画面のローカルプレビューです。')}</p><p class="legal">${t('실제 전송 없음 · 선택한 예시 심박 리듬','実際の送信なし · 選択したサンプル心拍')}</p>`)}}
function breatheDemo(){stopInteraction();modal(`<span class="eyebrow">BREATHE TOGETHER · 24 SEC</span><h2>${t('잠깐, 우리에게 돌아오는 시간.','少しだけ、ふたりに戻る時間。')}</h2><div class="breath-orbits"><span>${t('나','自分')}</span><span>${t('지우','ジウ')}</span></div><p>${t('원이 커지면 들이쉬고, 작아지면 내쉬어요. 같은 가이드를 함께 따라가는 체험이에요.','円が大きくなったら吸って、小さくなったら吐きます。同じガイドを一緒に追う体験です。')}</p><label class="consent"><input id="breath-consent" type="checkbox">${t('두 사람의 참여에 동의하고 체험할게요. 지우의 참여는 시뮬레이션이에요.','ふたりの参加に同意して体験します。ジウの参加はシミュレーションです。')}</label><button class="primary wide" id="start-breath" disabled>${t('함께 24초 쉬어가기','一緒に24秒ひと休み')}</button><p class="legal">${t('호흡은 편안한 범위에서 따라가세요. 언제든 닫아서 중단할 수 있어요.','無理のない範囲で呼吸してください。いつでも閉じて終了できます。')}</p>`);$('#breath-consent').onchange=()=>{$('#start-breath').disabled=!$('#breath-consent').checked};$('#start-breath').onclick=()=>{if(!$('#breath-consent').checked)return;$('#modal').close();modal(`<span class="eyebrow">OUR SHARED PAUSE · DEMO</span><h2 id="breath-instruction" aria-live="polite">${t('천천히 들이쉬어요','ゆっくり吸って')}</h2><div class="breath-orbits running"><span>${t('나','自分')}</span><span>${t('지우','ジウ')}</span></div><div class="breath-count"><b id="breath-seconds">24</b><small>${t('초 남음 · 3번의 호흡','秒残り · 3回の呼吸')}</small></div><progress id="breath-progress" max="24" value="0" aria-label="${t('함께 호흡 진행','一緒に呼吸の進捗')}"></progress><p class="legal">${t('같은 시간 안내를 따르는 시뮬레이션 · 실제 심박 일치도 아님','同じタイミングのガイドを追うシミュレーション · 実際の心拍一致度ではありません')}</p>`);const started=Date.now();let lastPhase=-1;interactionTimer=setInterval(()=>{if(!$('#modal').open){stopInteraction();return}const elapsed=Math.min(24,(Date.now()-started)/1000);$('#breath-seconds').textContent=Math.ceil(24-elapsed);$('#breath-progress').value=elapsed;const phase=Math.floor(elapsed/4)%2;if(phase!==lastPhase){$('#breath-instruction').textContent=phase?t('천천히 내쉬어요','ゆっくり吐いて'):t('천천히 들이쉬어요','ゆっくり吸って');lastPhase=phase}if(elapsed>=24){stopInteraction();state.breathSessions=(state.breathSessions||0)+1;persist();$('#modal').close();render();modal(`<span class="eyebrow">A MOMENT WE SHARED</span><div class="breath-finished">◯<i>◯</i></div><h2>${t('24초, 함께 쉬어갔어요.','24秒、一緒にひと休み。')}</h2><p>${t('말 한마디 없이도 함께한 시간이 쌓였어요. 오늘의 공동 호흡 1회를 기록했어요.','言葉がなくても、一緒の時間が増えました。今日の共同呼吸を1回記録しました。')}</p><div class="data-result"><strong>24<small>sec</small></strong><strong>3<small>${t('번의 호흡','回の呼吸')}</small></strong></div><p class="legal">${t('타이머 완료 기록입니다. 건강 효과나 관계 점수를 계산하지 않습니다.','タイマーの完了記録です。健康効果や関係スコアは計算しません。')}</p>`) }},200)}}
function sleepGarden(){stopInteraction();modal(`<span class="eyebrow">OUR SLEEP GARDEN · DEMO</span><h2>${t('우리의 쉼으로 피우는 꽃.','ふたりの休息で咲く花。')}</h2><p>${t('각자의 목표를 채우면 잎이 하나씩 자라요. 둘의 잎이 모두 차면 오늘의 꽃을 피워요.','それぞれの目標で葉が育ちます。2枚とも満たされたら、今日の花が咲きます。')}</p><label class="consent"><input id="garden-consent" type="checkbox">${t('내 수면 시간으로 공동 정원을 만드는 체험에 동의해요. 지우는 참여에 동의한 예시예요.','自分の睡眠時間で共同ガーデンを作る体験に同意します。ジウは同意済みのサンプルです。')}</label><button class="primary wide" id="open-garden" disabled>${t('우리 정원 가꾸기','ふたりの庭を育てる')}</button><p class="legal">${t('이번 체험에만 사용하며 기존 수면 공유 설정은 바꾸지 않아요.','今回の体験にのみ使用し、既存の睡眠共有設定は変えません。')}</p>`);$('#garden-consent').onchange=()=>{$('#open-garden').disabled=!$('#garden-consent').checked};$('#open-garden').onclick=()=>{if(!$('#garden-consent').checked)return;$('#modal').close();gardenView()}}
function gardenView(){modal(`<span class="eyebrow">OUR SLEEP GARDEN · SAMPLE DAY 01</span><h2>${t('경쟁 없이, 함께 자라요.','競わずに、一緒に育つ。')}</h2><div id="garden-stage"></div><div class="garden-goals"><label>${t('나의 목표','自分の目標')}<select id="my-sleep-goal"><option value="420">7h</option><option value="450" selected>7h 30m</option><option value="480">8h</option></select></label><label>${t('지우의 목표 · 예시','ジウの目標 · 例')}<select id="partner-sleep-goal"><option value="420">7h</option><option value="450" selected>7h 30m</option><option value="480">8h</option></select></label></div><div class="sample-switch" role="group" aria-label="${t('수면 예시 데이터','睡眠サンプルデータ')}"><button id="sleep-short" class="selected" aria-pressed="true">${t('조금 짧게 잔 날','少し短く眠った日')}</button><button id="sleep-full" aria-pressed="false">${t('둘 다 푹 잔 날','ふたりともよく眠った日')}</button></div><button class="primary wide" id="bloom-flower" disabled>${t('오늘의 꽃 피우기','今日の花を咲かせる')}</button><p class="legal">${t('수면 목표 달성률을 잎으로 표현한 놀이예요. 건강·관계 점수가 아닙니다. 한 예시 날짜에는 꽃을 한 번만 기록합니다.','睡眠目標の達成率を葉で表す遊びです。健康・関係スコアではありません。同じサンプル日は一輪だけ記録します。')}</p>`);let full=!!state.gardenClaimed;function update(){const mine=full?480:462,partner=full?480:372;const a=Math.min(1,mine/Number($('#my-sleep-goal').value)),b=Math.min(1,partner/Number($('#partner-sleep-goal').value));const ready=a===1&&b===1;$('#garden-stage').innerHTML=`<div class="garden-plant ${ready?'ready':''}"><span class="garden-bloom">${state.gardenClaimed?'✿':ready?'✾':'·'}</span><div class="garden-stem"></div><div class="garden-leaf leaf-left" style="--fill:${a*100}%"></div><div class="garden-leaf leaf-right" style="--fill:${b*100}%"></div><div class="garden-ground"></div></div><div class="garden-stats"><div><small>${t('나','自分')}</small><strong>${Math.floor(mine/60)}h ${mine%60}m</strong><span>${Math.round(a*100)}%</span></div><div><small>${t('지우 · 예시','ジウ · 例')}</small><strong>${Math.floor(partner/60)}h ${partner%60}m</strong><span>${Math.round(b*100)}%</span></div></div><p class="garden-caption">${ready?t('두 장의 잎이 모두 자랐어요.','2枚の葉が育ちました。'):t('오늘은 이만큼 자랐어요. 덜 채워도 괜찮아요.','今日はここまで育ちました。満たさなくても大丈夫。')}</p>`;['my-sleep-goal','partner-sleep-goal','sleep-short','sleep-full'].forEach(id=>{$('#'+id).disabled=!!state.gardenClaimed});$('#bloom-flower').disabled=!ready||!!state.gardenClaimed;$('#bloom-flower').textContent=state.gardenClaimed?t('오늘의 꽃을 정원에 기록했어요 ✓','今日の花を記録しました ✓'):t('오늘의 꽃 피우기','今日の花を咲かせる');['sleep-short','sleep-full'].forEach((id,i)=>{$('#'+id).classList.toggle('selected',full===(i===1));$('#'+id).setAttribute('aria-pressed',String(full===(i===1)))})}$('#my-sleep-goal').onchange=update;$('#partner-sleep-goal').onchange=update;$('#sleep-short').onclick=()=>{full=false;update()};$('#sleep-full').onclick=()=>{full=true;update()};$('#bloom-flower').onclick=()=>{if($('#bloom-flower').disabled)return;state.gardenClaimed=true;persist();update();toast(t('우리 정원에 첫 꽃이 피었어요. ✿','ふたりの庭に最初の花が咲きました。✿'));render()};update()}

$('#modal').addEventListener('close',()=>{if(!$('#modal').open)stopInteraction()});
window.addEventListener('hashchange',()=>{if($('#modal').open)$('#modal').close();render();window.scrollTo(0,0)});$('#modal').addEventListener('click',e=>{if(e.target===$('#modal')){const r=$('#modal').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$('#modal').close()}});render();
</script></body></html>
