<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SAI — 둘만의 작은 일상, 사이</title>
  <meta name="description" content="내 리듬도, 네 기분도. 한국과 일본의 20대 커플을 위한 컨템포러리 스마트링, SAI.">
  <meta property="og:title" content="SAI — 둘만의 작은 일상, 사이">
  <meta property="og:description" content="내 하루에, 네가 쏙. 둘이 함께 쓰는 감성 커플 스마트링.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="/assets/ring-hands-closeup-v6.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Pretendard:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-page: #ffffff;
      --bg-cream: #ffffff;
      --bg-sand: #ffffff;
      --bg-surface: #ffffff;
      --bg-sage-subtle: #f4f6f0;
      --bg-dark: #121612;
      --bg-dark-card: #1b211a;
      --text-dark: #181c16;
      --text-muted: #5e6658;
      --text-soft: #80887a;
      --text-light: #f5f6ed;
      --text-light-muted: #a3b09c;
      --green-deep: #3b5032;
      --green-primary: #4a633e;
      --green-accent: #749561;
      --gold-accent: #c9a473;
      --silver-accent: #b0b8ac;
      --border-light: rgba(45, 60, 35, 0.08);
      --border-glass: rgba(255, 255, 255, 0.85);
      --border-glass-dark: rgba(255, 255, 255, 0.12);
      --shadow-sm: 0 4px 16px rgba(25, 35, 20, 0.04);
      --shadow-glass: 0 16px 40px rgba(25, 35, 20, 0.05), inset 0 1px 0 rgba(255, 255, 255, 0.9);
      --shadow-glass-dark: 0 20px 48px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      --shadow-lg: 0 24px 56px rgba(25, 35, 20, 0.08);
      --font-sans: 'Pretendard', 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', 'Apple SD Gothic Neo', sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      width: 100%;
      overflow-x: hidden;
      background-color: var(--bg-page);
      color: var(--text-dark);
      font-family: var(--font-sans);
      line-height: 1.74;
      letter-spacing: -0.015em;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Natural line breaking across all devices */
    h1, h2, h3, h4, p, span, blockquote, summary, details {
      word-break: keep-all;
      overflow-wrap: break-word;
    }

    :lang(ja) {
      word-break: normal;
      line-break: strict;
    }
    :lang(ja) .hero-content {
      max-width: 660px;
    }
    :lang(ja) .hero-title {
      font-size: clamp(2.8rem, 4.8vw, 4.2rem);
      line-height: 1.25;
      letter-spacing: -0.02em;
    }
    :lang(ja) .hero-desc {
      font-size: clamp(1.15rem, 2.0vw, 1.35rem);
    }

    img {
      max-width: 100%;
      height: auto;
      display: block;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      outline: none;
      background: none;
      transition: all 0.24s cubic-bezier(0.16, 1, 0.3, 1);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 1.5rem;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--green-primary);
      margin-bottom: 0.95rem;
    }

    .eyebrow-dark {
      color: var(--text-light-muted);
    }

    /* Buttons */
    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background-color: var(--green-primary);
      color: #ffffff;
      padding: 0.95rem 1.95rem;
      border-radius: 9999px;
      font-size: 1.02rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      box-shadow: 0 6px 18px rgba(70, 95, 60, 0.22);
      transition: transform 0.24s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.24s ease, background-color 0.24s ease;
    }
    .btn-primary:hover {
      background-color: var(--green-deep);
      transform: translateY(-2px) scale(1.015);
      box-shadow: 0 10px 26px rgba(70, 95, 60, 0.32);
    }
    .btn-primary:active {
      transform: translateY(0);
    }

    .btn-secondary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      color: var(--green-primary);
      border: 1px solid rgba(74, 99, 62, 0.25);
      padding: 0.92rem 1.85rem;
      border-radius: 9999px;
      font-size: 0.98rem;
      font-weight: 600;
      box-shadow: var(--shadow-sm);
      transition: transform 0.24s cubic-bezier(0.16, 1, 0.3, 1), background 0.24s ease, border-color 0.24s ease;
    }
    .btn-secondary:hover {
      background: rgba(74, 99, 62, 0.08);
      border-color: var(--green-primary);
      transform: translateY(-2px);
    }

    /* Header Nav */
    .landing-nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(24px) saturate(160%);
      -webkit-backdrop-filter: blur(24px) saturate(160%);
      border-bottom: 1px solid rgba(45, 60, 35, 0.06);
      padding: 1rem 0;
    }

    .landing-nav-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .v9-logo {
      display: inline-flex;
      align-items: center;
      transition: transform 0.3s ease;
    }
    .v9-logo:hover {
      transform: scale(1.03);
    }
    .v9-logo svg {
      height: 36px;
      width: auto;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 1.1rem;
    }

    .nav-link {
      font-size: 0.94rem;
      font-weight: 600;
      color: var(--text-muted);
      padding: 0.4rem 0.6rem;
      border-radius: 9999px;
      transition: color 0.2s ease;
    }
    .nav-link:hover {
      color: var(--text-dark);
    }

    .lang-btn {
      font-size: 0.88rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      border: 1px solid rgba(45, 60, 35, 0.12);
      padding: 0.48rem 0.95rem;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
    }
    .lang-btn:hover {
      background: #ffffff;
      color: var(--text-dark);
      border-color: rgba(45, 60, 35, 0.24);
      transform: translateY(-1px);
    }

    /* 1. HERO SECTION */
    .hero {
      position: relative;
      padding: 5.2rem 0 5.6rem;
      overflow: hidden;
      background: var(--bg-page);
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.12fr 1fr;
      align-items: center;
      gap: 3.5rem;
    }

    .hero-content {
      max-width: 600px;
    }

    /* Hero headline: SANS-SERIF ONLY + 2pt increase */
    .hero-title {
      font-family: var(--font-sans) !important;
      font-size: clamp(3.45rem, 6.6vw, 5.5rem);
      font-weight: 800;
      line-height: 1.12;
      letter-spacing: -0.04em;
      color: var(--text-dark);
      margin-bottom: 1.7rem;
    }

    .hero-title span {
      font-family: var(--font-sans) !important;
      font-style: normal;
      font-weight: 800;
      color: var(--green-deep);
    }

    /* Hero description: +2pt increase */
    .hero-desc {
      font-size: clamp(1.22rem, 2.2vw, 1.48rem);
      font-weight: 400;
      color: var(--text-muted);
      line-height: 1.72;
      margin-bottom: 2.3rem;
    }

    .hero-actions {
      display: flex;
      align-items: center;
      gap: 1.25rem;
      flex-wrap: wrap;
    }

    .hero-art {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Hero Ring Cutout: Fully transparent, gentle ambient floating motion */
    .hero-art-img {
      width: 100%;
      max-width: 500px;
      height: auto;
      filter: drop-shadow(0 26px 46px rgba(35, 45, 30, 0.09));
      animation: heroRingFloat 7s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }

    @keyframes heroRingFloat {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-9px) scale(1.008); }
    }

    /* Floating notes: Glassmorphism + 22px rounded + distinct gentle micro-motion */
    .floating-note {
      position: absolute;
      background: rgba(255, 255, 255, 0.76);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid var(--border-glass);
      border-radius: 22px;
      padding: 1.05rem 1.45rem;
      font-size: 0.94rem;
      font-weight: 600;
      color: var(--text-dark);
      box-shadow: var(--shadow-glass);
      display: flex;
      flex-direction: column;
      gap: 4px;
      z-index: 2;
      transition: transform 0.3s ease;
    }

    .floating-note:hover {
      transform: scale(1.03);
    }

    .floating-note.top {
      top: 5%;
      left: -10px;
      animation: floatTopNote 6s ease-in-out infinite alternate;
    }
    .floating-note.bottom {
      bottom: 7%;
      right: -10px;
      animation: floatBottomNote 6.5s ease-in-out infinite alternate;
    }

    .floating-note small {
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--text-soft);
    }

    @keyframes floatTopNote {
      0% { transform: translateY(0px) rotate(0deg); }
      100% { transform: translateY(-10px) rotate(0.4deg); }
    }
    @keyframes floatBottomNote {
      0% { transform: translateY(0px) rotate(0deg); }
      100% { transform: translateY(8px) rotate(-0.4deg); }
    }

    /* Ritual Strip */
    .teaser-ritual {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      padding: 1.6rem 1rem;
      border-top: 1px solid rgba(45, 60, 35, 0.06);
      border-bottom: 1px solid rgba(45, 60, 35, 0.06);
      background: rgba(255, 255, 255, 0.92);
      font-size: 0.96rem;
      font-weight: 600;
      color: var(--green-primary);
      letter-spacing: -0.01em;
    }
    .teaser-ritual i {
      font-style: normal;
      color: rgba(45, 60, 35, 0.18);
    }

    /* 2. REAL COUPLE MOMENT: BRIGHT MORNING INTIMACY */
    .lifestyle-section {
      padding: 7rem 0;
      background: var(--bg-page);
    }

    .lifestyle-grid {
      display: grid;
      grid-template-columns: 1fr 1.08fr;
      align-items: center;
      gap: 4.8rem;
    }

    .editorial-photo-card {
      position: relative;
      aspect-ratio: 16 / 9;
      border-radius: 36px;
      overflow: hidden;
      box-shadow: var(--shadow-lg);
      background: #f8f8f8;
      isolation: isolate;
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.4s ease;
    }
    .editorial-photo-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 30px 64px rgba(25, 35, 20, 0.12);
    }

    .editorial-photo-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .editorial-photo-card:hover img {
      transform: scale(1.025);
    }

    /* Section 2 Title: +2pt increase */
    .lifestyle-copy h2 {
      font-size: clamp(2.3rem, 4.4vw, 3.65rem);
      font-weight: 700;
      line-height: 1.25;
      letter-spacing: -0.03em;
      margin-bottom: 1.5rem;
      color: var(--text-dark);
    }

    /* Brand green dynamic typing bubble (80% scale, single-run) */
    .lifestyle-msg-bubble {
      display: inline-flex;
      align-items: center;
      position: relative;
      background: var(--green-primary);
      background: linear-gradient(135deg, #58774b 0%, #435b37 100%);
      color: #ffffff;
      font-size: 0.80em;
      padding: 0.14em 0.54em 0.18em 0.54em;
      border-radius: 9999px;
      vertical-align: 0.10em;
      margin-right: 0.30em;
      box-shadow: 0 4px 14px rgba(70, 95, 60, 0.24), 0 2px 5px rgba(70, 95, 60, 0.14);
      font-weight: 700;
      white-space: nowrap;
      letter-spacing: -0.015em;
      line-height: 1.15;
      transform-origin: left center;
      transition: filter 0.2s ease;
    }

    .lifestyle-msg-bubble:hover {
      filter: brightness(1.05);
    }

    .lifestyle-msg-bubble.bubble-pop {
      animation: msgBubblePop 0.38s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes msgBubblePop {
      0% { transform: scale(1); }
      40% { transform: scale(1.06); }
      100% { transform: scale(1); }
    }

    /* Ghost text ensures the bubble maintains its exact width and never causes adjacent text to jump */
    .msg-typing-ghost {
      visibility: hidden;
      pointer-events: none;
      user-select: none;
      opacity: 0;
      line-height: 1.15;
    }

    .msg-typing-wrap {
      position: absolute;
      left: 0.54em;
      right: 0.54em;
      top: 50%;
      transform: translateY(-50%);
      display: inline-flex;
      align-items: center;
      white-space: nowrap;
    }

    .msg-typing-text {
      color: #ffffff;
      letter-spacing: -0.01em;
    }

    .msg-typing-cursor {
      display: inline-block;
      width: 2.2px;
      height: 0.9em;
      background-color: #ffffff;
      margin-left: 2px;
      border-radius: 1px;
      vertical-align: -0.05em;
      animation: msgCursorBlink 0.75s infinite;
    }

    @keyframes msgCursorBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* Section 2 Body: +2pt increase */
    .lifestyle-copy p {
      font-size: 1.22rem;
      color: var(--text-muted);
      line-height: 1.76;
      margin-bottom: 1.9rem;
    }

    .lifestyle-quote {
      font-size: 1.38rem;
      font-weight: 500;
      color: var(--green-deep);
      border-left: 3px solid var(--green-accent);
      padding-left: 1.35rem;
      margin: 2rem 0;
      line-height: 1.55;
      letter-spacing: -0.015em;
    }

    .sleep-share-card {
      position: absolute;
      left: 1.35rem;
      bottom: 1.35rem;
      z-index: 2;
      width: min(270px, calc(100% - 2.7rem));
      padding: 1.15rem 1.25rem;
      border: 1px solid rgba(255, 255, 255, 0.78);
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.84);
      backdrop-filter: blur(22px) saturate(155%);
      -webkit-backdrop-filter: blur(22px) saturate(155%);
      box-shadow: 0 16px 38px rgba(22, 30, 18, 0.16);
    }

    .sleep-share-card-head,
    .sleep-share-card-status {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }

    .sleep-share-card-head {
      margin-bottom: 0.55rem;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.11em;
      color: var(--text-soft);
    }

    .sleep-share-card-head b {
      color: var(--green-primary);
      font-size: 0.7rem;
      letter-spacing: 0.04em;
    }

    .sleep-share-card strong {
      display: block;
      font-size: 1.92rem;
      line-height: 1.08;
      color: var(--text-dark);
      letter-spacing: -0.04em;
      margin-bottom: 0.45rem;
    }

    .sleep-share-card-status {
      color: var(--text-muted);
      font-size: 0.82rem;
      font-weight: 600;
    }

    .sleep-share-card-status span:last-child {
      color: var(--green-primary);
    }

    .lifestyle-privacy {
      display: inline-flex;
      align-items: center;
      gap: 0.85rem;
      padding: 0.9rem 1.15rem;
      border-radius: 18px;
      background: var(--bg-sage-subtle);
      border: 1px solid rgba(74, 99, 62, 0.09);
    }

    .lifestyle-privacy > span {
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      color: #fff;
      background: var(--green-primary);
      font-size: 0.78rem;
      font-weight: 800;
    }

    .lifestyle-privacy strong,
    .lifestyle-privacy small {
      display: block;
    }

    .lifestyle-privacy strong {
      color: var(--text-dark);
      font-size: 0.94rem;
      line-height: 1.35;
    }

    .lifestyle-privacy small {
      margin-top: 0.12rem;
      color: var(--text-soft);
      font-size: 0.78rem;
      line-height: 1.35;
    }

    /* 3. SIGNATURE FEATURE: SEND A BEAT */
    .heartbeat-feature-section {
      position: relative;
      overflow: hidden;
      padding: 8rem 0;
      background:
        radial-gradient(circle at 78% 18%, rgba(190, 116, 104, 0.15), transparent 31%),
        radial-gradient(circle at 18% 88%, rgba(112, 143, 92, 0.12), transparent 34%),
        linear-gradient(135deg, #fbf7f2 0%, #ffffff 50%, #f0f4ed 100%);
      border-top: 1px solid rgba(45, 60, 35, 0.06);
      border-bottom: 1px solid rgba(45, 60, 35, 0.06);
    }

    .heartbeat-feature-grid {
      display: grid;
      grid-template-columns: 0.9fr 1.1fr;
      align-items: center;
      gap: clamp(3rem, 7vw, 6.5rem);
    }

    .heartbeat-feature-copy {
      max-width: 520px;
    }

    .heartbeat-feature-copy h2 {
      font-size: clamp(3rem, 5.4vw, 4.75rem);
      font-weight: 800;
      line-height: 1.08;
      letter-spacing: -0.045em;
      margin-bottom: 1.55rem;
    }

    .heartbeat-feature-copy h2 em {
      color: #9b5751;
      font-style: normal;
    }

    .heartbeat-feature-copy > p {
      max-width: 470px;
      font-size: 1.22rem;
      color: var(--text-muted);
      line-height: 1.76;
      margin-bottom: 1.8rem;
    }

    .heartbeat-privacy-line {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      color: var(--green-deep);
      font-size: 0.92rem;
      font-weight: 700;
    }

    .heartbeat-privacy-line i {
      display: block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green-accent);
      box-shadow: 0 0 0 6px rgba(116, 149, 97, 0.12);
    }

    .heartbeat-demo-shell {
      position: relative;
      min-height: 540px;
      padding: 2rem;
      border-radius: 44px;
      background: rgba(255, 255, 255, 0.86);
      border: 1px solid rgba(255, 255, 255, 0.95);
      box-shadow: 0 30px 80px rgba(74, 58, 48, 0.12), inset 0 1px 0 rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(24px) saturate(150%);
      -webkit-backdrop-filter: blur(24px) saturate(150%);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .heartbeat-demo-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      color: var(--text-soft);
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 0.1em;
    }

    .heartbeat-demo-top b {
      padding: 0.35rem 0.7rem;
      border-radius: 999px;
      background: #f3eee8;
      color: #8a625a;
      font-size: 0.68rem;
      letter-spacing: 0.06em;
    }

    .heartbeat-demo-main {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 1.2rem 0 0.7rem;
    }

    .heartbeat-demo-main > p {
      color: var(--text-soft);
      font-size: 0.83rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      margin-bottom: 0.15rem;
    }

    .heartbeat-demo-main h3 {
      color: var(--text-dark);
      font-size: clamp(1.55rem, 2.7vw, 2.05rem);
      letter-spacing: -0.03em;
      margin-bottom: 0.25rem;
    }

    .heartbeat-demo-heart {
      position: relative;
      display: grid;
      place-items: center;
      width: 160px;
      height: 150px;
      margin: 0.25rem auto;
    }

    .heartbeat-demo-heart::before,
    .heartbeat-demo-heart::after {
      content: "";
      position: absolute;
      inset: 32px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(230, 70, 86, 0.30), rgba(236, 126, 129, 0.10) 48%, transparent 72%);
      filter: blur(7px);
      animation: heartbeatFeatureGlow 1.54s cubic-bezier(0.15, 0.8, 0.25, 1) infinite;
    }

    .heartbeat-demo-heart::after {
      animation-delay: -0.77s;
    }

    .heartbeat-demo-heart img {
      position: relative;
      z-index: 2;
      width: 78px;
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0 12px 22px rgba(211, 49, 68, 0.26));
      animation: heartbeatFeatureBeat 1.54s ease-in-out infinite;
    }

    @keyframes heartbeatFeatureGlow {
      0% { transform: scale(0.65); opacity: 0.9; }
      55% { opacity: 0.38; }
      100% { transform: scale(2.45); opacity: 0; }
    }

    @keyframes heartbeatFeatureBeat {
      0%, 100% { transform: scale(1); }
      12% { transform: scale(1.16); }
      24% { transform: scale(1.02); }
      38% { transform: scale(1.11); }
      58% { transform: scale(1); }

    .heartbeat-demo-bpm {
      color: var(--text-dark);
      font-size: 2.8rem;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.04em;
      margin-bottom: 1.2rem;
    }

    .heartbeat-demo-bpm small {
      color: var(--text-soft);
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0;
    }

    .heartbeat-send-button {
      min-width: 210px;
    }

    .heartbeat-send-button:disabled {
      cursor: wait;
      opacity: 0.72;
      transform: none;
    }

    .heartbeat-demo-status {
      min-height: 1.5em;
      margin-top: 0.75rem;
      color: var(--text-soft);
      font-size: 0.84rem;
      font-weight: 600;
    }

    .heartbeat-demo-steps {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.65rem;
      padding-top: 1.15rem;
      border-top: 1px solid rgba(45, 60, 35, 0.08);
    }

    .heartbeat-demo-step {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      padding: 0.65rem 0.7rem;
      border-radius: 14px;
      color: var(--text-soft);
      background: rgba(244, 246, 240, 0.72);
      font-size: 0.75rem;
      font-weight: 700;
      transition: color 0.3s ease, background 0.3s ease, transform 0.3s ease;
    }

    .heartbeat-demo-step b {
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      color: var(--text-soft);
      background: #ffffff;
      font-size: 0.68rem;
    }

    .heartbeat-demo-step:first-child,
    .heartbeat-demo-shell.is-sending .heartbeat-demo-step:nth-child(2),
    .heartbeat-demo-shell.is-sent .heartbeat-demo-step {
      color: var(--green-deep);
      background: rgba(226, 236, 214, 0.78);
      transform: translateY(-2px);
    }

    .heartbeat-demo-shell.is-sending .heartbeat-demo-heart img {
      animation: heartbeatFeatureSend 0.85s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .heartbeat-demo-shell.is-sent .heartbeat-demo-heart img {
      animation: heartbeatFeatureArrive 0.55s cubic-bezier(0.2, 1.5, 0.4, 1) both;
    }

    @keyframes heartbeatFeatureSend {
      0% { transform: scale(1); opacity: 1; }
      45% { transform: scale(0.72) translateX(56px); opacity: 0.35; }
      55% { transform: scale(0.72) translateX(-56px); opacity: 0; }
      100% { transform: scale(1) translateX(0); opacity: 1; }
    }

    @keyframes heartbeatFeatureArrive {
      0% { transform: scale(0.82); }
      55% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }

    /* 4. SECTION 3: HAND + RING CLOSE-UP (HEROIC EDITORIAL SECTION) */
    .ring-macro-section {
      padding: 7rem 0;
      background: var(--bg-page);
      border-top: 1px solid rgba(45, 60, 35, 0.06);
      border-bottom: 1px solid rgba(45, 60, 35, 0.06);
    }

    .macro-header {
      text-align: center;
      max-width: 800px;
      margin: 0 auto 3.8rem;
    }

    /* Macro Title: +2pt increase */
    .macro-header h2 {
      font-size: clamp(2.6rem, 5.0vw, 4.05rem);
      font-weight: 700;
      line-height: 1.18;
      letter-spacing: -0.03em;
      margin-bottom: 1.3rem;
    }

    /* Macro Body: +2pt increase */
    .macro-header p {
      font-size: 1.22rem;
      color: var(--text-muted);
      line-height: 1.74;
    }

    .macro-feature-display {
      position: relative;
      border-radius: 42px;
      overflow: hidden;
      box-shadow: 0 28px 64px rgba(25, 35, 20, 0.1);
      max-width: 1100px;
      margin: 0 auto;
      transition: transform 0.4s ease;
    }

    .macro-feature-display img {
      width: 100%;
      height: auto;

      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .macro-feature-display:hover img {
      transform: scale(1.02);
    }

    /* Macro Glass Overlay: 24px + Glassmorphism + Micro-motion on hover */
    .macro-overlay-card {
      position: absolute;
      bottom: 1.35rem;
      left: 1.5rem;
      right: 1.5rem;
      background: rgba(255, 255, 255, 0.78);
      backdrop-filter: blur(24px) saturate(180%);

      padding: 1.15rem 2rem;

      align-items: center;
      justify-content: space-between;
      gap: 1.5rem;
      box-shadow: var(--shadow-glass);
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.35s ease;
    }
    .macro-feature-display:hover .macro-overlay-card {
      transform: translateY(-4px);
      box-shadow: 0 24px 60px rgba(25, 35, 20, 0.12), inset 0 1px 0 rgba(255, 255, 255, 0.95);
    }

    .macro-overlay-text strong {
      display: block;
      font-size: 1.28rem;
      font-weight: 700;
      color: var(--text-dark);
      margin-bottom: 0.25rem;
    }
    .macro-overlay-text p {
      font-size: 1.04rem;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .macro-specs-strip {
      display: flex;
      align-items: center;
      gap: 2.2rem;
    }

    .spec-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .spec-item span {
      font-size: 0.76rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-soft);
      font-weight: 700;
    }
    .spec-item strong {
      font-size: 1.15rem;
      color: var(--green-deep);
      font-weight: 700;
    }

    /* 4. VISUAL INTERRUPTION SECTION: DEEP FOREST WITH BRIGHT EDITORIAL PHOTO */
    .deep-forest-section {
      background-color: var(--bg-dark);
      color: var(--text-light);
      padding: 8rem 0;
      position: relative;
      overflow: hidden;
    }

    .deep-forest-section::before {
      content: "";
      position: absolute;
      top: -20%;
      right: -10%;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(120, 153, 101, 0.16) 0%, transparent 70%);
      pointer-events: none;
    }

    .interruption-header {
      margin-bottom: 4.2rem;
    }

    /* Interruption Title: +2pt increase */
    .interruption-header h2 {
      font-size: clamp(2.8rem, 5.8vw, 4.65rem);
      font-weight: 700;
      line-height: 1.16;
      letter-spacing: -0.035em;
      color: var(--text-light);
      margin-bottom: 1.4rem;
    }

    /* Interruption Body: +2pt increase */
    .interruption-header p {
      font-size: clamp(1.22rem, 2.2vw, 1.38rem);
      color: var(--text-light-muted);
      max-width: 720px;
      line-height: 1.72;
    }

    .interruption-grid {
      display: grid;
      grid-template-columns: 1.15fr 1fr;
      align-items: center;
      gap: 4.2rem;
    }

    .interruption-photo {
      border-radius: 36px;
      overflow: hidden;
      box-shadow: 0 24px 50px rgba(0, 0, 0, 0.5);
      border: 1px solid var(--border-glass-dark);

    }
    .interruption-photo:hover {
      transform: translateY(-4px);
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
    }
    .interruption-photo img {
      width: 100%;
      height: auto;
      display: block;
      transition: transform 0.6s ease;
    }
    .interruption-photo:hover img {
      transform: scale(1.02);
    }

    .interruption-features {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    /* Dark Glass: 28px + Glassmorphism + Hover Lift */
    .dark-card {
      background: rgba(27, 33, 26, 0.7);
      backdrop-filter: blur(24px) saturate(150%);
      -webkit-backdrop-filter: blur(24px) saturate(150%);
      border: 1px solid var(--border-glass-dark);
      border-radius: 28px;
      padding: 1.85rem 2.1rem;
      box-shadow: var(--shadow-glass-dark);
      transition: transform 0.32s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.32s ease, box-shadow 0.32s ease;
    }
    .dark-card:hover {
      border-color: rgba(140, 180, 115, 0.45);
      transform: translateY(-3px) scale(1.01);
      box-shadow: 0 24px 52px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.12);

    .dark-card-head {

      justify-content: center;

    .dark-card-head h3 {

    .dark-card p {

    .v9-experience {

    .experience-header {
      text-align: center;
      max-width: 720px;
      margin: 0 auto 3.2rem;
    }

    /* Experience Title: +2pt increase */
    .experience-header h2 {
      font-size: clamp(2.4rem, 4.5vw, 3.45rem);
      font-weight: 700;
      line-height: 1.22;
      letter-spacing: -0.03em;
      margin-bottom: 1.1rem;
    }

    /* Experience Body: +2pt increase */
    .experience-header p {
      font-size: 1.22rem;
      color: var(--text-muted);
      line-height: 1.74;

    .story-tabs {
      display: flex;

    .story-tabs button {

    .story-tabs button[aria-pressed="true"] {
      background: var(--green-primary);
      color: #ffffff;
      border-color: var(--green-primary);
      box-shadow: 0 6px 20px rgba(74, 99, 62, 0.28);
    }

    .s5-mobile-slider-wrap {
      display: none;
    }

    .v9-experience-stage {
      display: grid;
      grid-template-columns: 290px 400px 290px;
      justify-content: center;
      align-items: center;
      gap: 2.8rem;
    }

    /* Side notes: 28px + Glassmorphism + subtle floating sway */
    .v9-side-note {
      background: #ffffff;
      border-radius: 28px;
      padding: 2rem 2.1rem;
      box-shadow: 0 16px 36px rgba(35, 45, 30, 0.07), 0 2px 8px rgba(35, 45, 30, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.95);

      flex-direction: column;
      gap: 0.7rem;
      transition: transform 0.3s ease;
    }
    .v9-side-note:first-child {
      animation: sideNoteFloatLeft 6.5s ease-in-out infinite;
    }
    .v9-side-note.peach {
      background: #fffdf9;
      border: 1px solid rgba(240, 200, 170, 0.3);
      box-shadow: 0 16px 36px rgba(220, 140, 100, 0.08), 0 2px 8px rgba(35, 45, 30, 0.03);
      animation: sideNoteFloatRight 6.5s ease-in-out infinite 0.8s;
    }
    .v9-side-note:hover {
      transform: translateY(-4px);
    }

    @keyframes sideNoteFloatLeft {
      0%, 100% { transform: translateY(0) translateX(0); }
      50% { transform: translateY(-6px) translateX(-2px); }
    }
    @keyframes sideNoteFloatRight {
      0%, 100% { transform: translateY(0) translateX(0); }
      50% { transform: translateY(-6px) translateX(2px); }
    }

    .v9-side-note span {
      font-size: 1.5rem;
      color: var(--green-deep);
    }
    .v9-side-note.peach span {
      color: var(--gold-accent);
    }
    .v9-side-note p {
      font-size: 1.12rem;
      font-weight: 600;
      line-height: 1.55;
      color: var(--text-dark);
    }
    .v9-side-note small {
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: var(--text-soft);
      text-transform: uppercase;
    }

    /* Interactive Mobile Phone Card: 48px + Glassmorphism + Gentle Breathing Glow */
    .s5-phone {
      width: 100%;
      background: #ffffff;
      border-radius: 48px;
      padding: 2.6rem 2.2rem;
      box-shadow: 0 24px 64px rgba(35, 45, 30, 0.09), 0 4px 16px rgba(35, 45, 30, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.95);
      position: relative;
      animation: phoneGlowBreath 6s ease-in-out infinite;

    @keyframes phoneGlowBreath {
      0%, 100% { box-shadow: 0 24px 64px rgba(35, 45, 30, 0.08), 0 4px 16px rgba(35, 45, 30, 0.03); }
      50% { box-shadow: 0 28px 72px rgba(74, 99, 62, 0.14), 0 6px 20px rgba(74, 99, 62, 0.06); }
    }

    .s5-phone-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: var(--text-soft);
      margin-bottom: 1.5rem;
    }
    .s5-phone-top svg {
      height: 22px;
      width: auto;
    }

    .s5-phone p {
      font-size: 0.92rem;
      color: var(--text-soft);
      font-weight: 500;
      margin-bottom: 0.35rem;
    }

    .s5-phone h3 {
      font-size: 1.48rem;
      font-weight: 700;
      color: var(--text-dark);
      letter-spacing: -0.02em;
      margin-bottom: 1.6rem;
    }

    .s5-score {
      display: flex;
      align-items: baseline;
      gap: 0.6rem;
      margin-bottom: 1.6rem;

      display: flex;

      padding: 0.85rem 0;
      border-bottom: 1px solid rgba(45, 60, 35, 0.08);
      font-size: 0.98rem;
      color: var(--text-muted);

    .s5-phone-row b {
      color: var(--text-dark);
      margin-left: 0.5rem;
    }

    .s5-heart-stage {
      position: relative;
      width: 84px;
      height: 74px;
      margin: 1.1rem auto 0.7rem auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Soft ambient gradient glow diffusion (NO lines/borders) */
    .s5-heart-glow-spread {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 52px;
      height: 52px;
      margin-top: -26px;
      margin-left: -26px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 1;
      background: radial-gradient(circle, rgba(255, 75, 105, 0.34) 0%, rgba(255, 120, 145, 0.14) 48%, transparent 75%);
      filter: blur(8px);
      animation: s5HeartGlowSpread 2.2s cubic-bezier(0.15, 0.8, 0.25, 1) infinite;
    }

    .s5-heart-glow-spread.g1 { animation-delay: 0s; }
    .s5-heart-glow-spread.g2 { animation-delay: -1.1s; }

    @keyframes s5HeartGlowSpread {
      0% {
        transform: scale(0.65);
        opacity: 0.9;
      }
      50% {
        opacity: 0.45;
      }
      100% {
        transform: scale(2.2);
        opacity: 0;
      }
    }

    .s5-heart-wrap {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;

        transform: scale(1.11);
      }
      60% {

      }

    .s5-pulse-number {

      font-size: 2.6rem;

    .s5-pulse-number small {

      letter-spacing: -0.03em;

      padding: 2.4rem;
      box-shadow: var(--shadow-glass);
      border: 1px solid var(--border-glass);
    }

    .preview-cal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.3rem;
      font-weight: 700;
    }
    .preview-cal-head span {
      font-size: 0.8rem;
      letter-spacing: 0.1em;
      color: var(--text-soft);
    }
    .preview-cal-head strong {
      font-size: 1.18rem;
    }

    .cal-weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-soft);
      margin-bottom: 0.6rem;
    }

    .cal-dates {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      text-align: center;
      font-size: 0.94rem;
    }
    .cal-dates span {
      padding: 8px 0;
      border-radius: 10px;
      position: relative;
      color: var(--text-dark);
      font-weight: 500;
      transition: transform 0.2s ease;
    }
    .cal-dates span.chosen {
      background: var(--green-primary);
      color: #ffffff;
      font-weight: 700;
      animation: chosenPulse 3.5s ease-in-out infinite;
    }
    @keyframes chosenPulse {
      0%, 100% { transform: scale(1); box-shadow: 0 2px 8px rgba(74, 99, 62, 0.2); }
      50% { transform: scale(1.06); box-shadow: 0 4px 14px rgba(74, 99, 62, 0.38); }
    }

    .cal-dates span.cycle-prediction {
      background: rgba(224, 116, 98, 0.14);
      color: #c44f3b;
      font-weight: 600;
    }

    /* Sub-plan: 20px */
    .preview-plan {
      margin-top: 1.5rem;
      padding: 1.25rem 1.5rem;
      background: var(--bg-sage-subtle);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: transform 0.25s ease;
    }
    .preview-plan:hover {
      transform: translateY(-2px);
    }
    .preview-plan small {
      display: block;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--green-primary);
      margin-bottom: 3px;
    }
    .preview-plan strong {
      display: block;
      font-size: 1.02rem;
      color: var(--text-dark);
    }
    .preview-plan p {
      font-size: 0.88rem;
      color: var(--text-muted);
      margin: 0;
    }

    /* 7. MORNING GARDEN (CLEAN TRANSPARENT CUTOUT + GENTLE CLOUD DRIFT) */
    .sai-garden {
      padding: 7rem 0;
      background: var(--bg-page);
    }

    .garden-grid {
      display: grid;
      grid-template-columns: 1fr 1.15fr;
      align-items: center;
      gap: 4.2rem;
    }

    /* Garden Title: +2pt increase */
    .garden-copy h2 {
      font-size: clamp(2.4rem, 4.6vw, 3.65rem);
      font-weight: 700;
      line-height: 1.22;
      letter-spacing: -0.03em;
      margin-bottom: 1.3rem;
    }
    /* Garden Body: +2pt increase */
    .garden-copy p {
      font-size: 1.22rem;
      color: var(--text-muted);
      line-height: 1.74;
      margin-bottom: 2.2rem;
    }

    /* Garden Image Cutout: Zero box background, soft cloud drift animation */
    .garden-img-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .garden-img-wrap img {
      width: 100%;
      max-width: 640px;
      height: auto;
      filter: drop-shadow(0 22px 40px rgba(35, 45, 30, 0.08));
      animation: gardenFloat 8s ease-in-out infinite;
    }

    @keyframes gardenFloat {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(0.4deg); }
    }

    /* 8. PRODUCT ARCHITECTURE */
    .product-architecture-section {
      padding: 7.5rem 0;
      background: var(--bg-page);
      border-top: 1px solid rgba(45, 60, 35, 0.06);
    }

    .product-lead-statement {
      text-align: center;
      max-width: 900px;
      margin: 0 auto 4.8rem;
    }

    .product-quote-en {
      font-size: clamp(1.55rem, 3.0vw, 2.3rem);
      font-weight: 700;
      color: var(--green-deep);
      margin-bottom: 1.1rem;
      line-height: 1.32;
      letter-spacing: -0.02em;
    }

    /* Product Lead Title: +2pt increase */
    .product-lead-statement h2 {
      font-size: clamp(2.4rem, 4.5vw, 3.65rem);
      font-weight: 700;
      line-height: 1.22;
      letter-spacing: -0.03em;
      color: var(--text-dark);
      margin-bottom: 1.1rem;
    }

    /* Product Lead Body: +2pt increase */
    .product-lead-statement p {
      font-size: 1.22rem;
      color: var(--text-muted);
      line-height: 1.74;
    }

    .product-feature-summary {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0.7rem;
      margin-top: 1.5rem;
    }

    .product-feature-summary span {
      display: inline-flex;
      align-items: center;
      min-height: 42px;
      padding: 0.55rem 0.95rem;
      border: 1px solid rgba(74, 99, 62, 0.11);
      border-radius: 999px;
      background: var(--bg-sage-subtle);
      color: var(--green-deep);
      font-size: 0.84rem;
      font-weight: 700;
    }

    .product-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2.8rem;
      max-width: 1020px;
      margin: 0 auto;
    }

    /* Product card: 36px + Glassmorphism + Hover Lift */
    .product-card {
      background: rgba(255, 255, 255, 0.78);
      backdrop-filter: blur(28px) saturate(170%);
      -webkit-backdrop-filter: blur(28px) saturate(170%);
      border: 1px solid var(--border-glass);
      border-radius: 36px;
      padding: 3.2rem 2.6rem;
      box-shadow: var(--shadow-glass);
      display: flex;
      flex-direction: column;
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.35s ease;
    }
    .product-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 28px 64px rgba(25, 35, 20, 0.11), inset 0 1px 0 rgba(255, 255, 255, 0.95);
    }

    .product-card-tag {
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      color: var(--green-primary);
      margin-bottom: 1.8rem;
    }

    .product-card-visual {
      height: 250px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 2.2rem;
    }

    .product-card-visual img {
      max-height: 230px;
      width: auto;
      object-fit: contain;
      filter: drop-shadow(0 16px 28px rgba(35, 45, 30, 0.08));
      transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .product-card:hover .product-card-visual img {
      transform: scale(1.04) rotate(1deg);
    }

    .membership-heart-stage {
      position: relative;
      width: 150px;
      height: 150px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Core ambient warm glow directly under heart */
    .membership-heart-stage::before {
      content: '';
      position: absolute;
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 75, 105, 0.25) 0%, rgba(255, 110, 135, 0.10) 50%, transparent 75%);
      filter: blur(10px);
      z-index: 1;
      pointer-events: none;
      animation: heartCoreGlow 3.2s ease-in-out infinite;
    }

    /* Outward softly diffusing gradient waves (NO lines/borders, pure soft gradient spread) */
    .heart-gradient-wave {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 64px;
      height: 64px;
      margin-top: -32px;
      margin-left: -32px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 1;
      background: radial-gradient(circle, rgba(255, 75, 105, 0.24) 0%, rgba(255, 115, 140, 0.10) 45%, rgba(255, 145, 165, 0.02) 70%, transparent 80%);
      filter: blur(10px);
      animation: heartGradientSpread 3.6s cubic-bezier(0.15, 0.8, 0.25, 1) infinite;
    }

    .heart-gradient-wave.w1 { animation-delay: 0s; }
    .heart-gradient-wave.w2 { animation-delay: -1.8s; }

    @keyframes heartGradientSpread {
      0% {
        transform: scale(0.65);
        opacity: 0.85;
      }
      50% {
        opacity: 0.45;
      }
      100% {
        transform: scale(2.4);
        opacity: 0;
      }
    }

    @keyframes heartCoreGlow {
      0%, 100% {
        transform: scale(0.95);
        opacity: 0.55;
      }
      50% {
        transform: scale(1.18);
        opacity: 0.9;
      }
    }

    .heart-3d-wrap {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: heartGentlePulse 3.2s ease-in-out infinite;
    }

    .heart-3d-img {
      width: 60px;
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0 8px 16px rgba(225, 45, 70, 0.22)) drop-shadow(0 2px 5px rgba(225, 45, 70, 0.14));
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), filter 0.4s ease;
    }

    .product-card:hover .heart-3d-img {
      transform: scale(1.08) translateY(-2px);
      filter: drop-shadow(0 12px 22px rgba(225, 45, 70, 0.30)) drop-shadow(0 3px 8px rgba(225, 45, 70, 0.18));
    }

    @keyframes heartGentlePulse {
      0%, 100% {
        transform: scale(1);
      }
      12% {
        transform: scale(1.06);
      }
      22% {
        transform: scale(1.01);
      }
      34% {
        transform: scale(1.05);
      }
      55% {
        transform: scale(1);
      }
    }

    .product-card h3 {
      font-size: 1.68rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.9rem;
      color: var(--text-dark);
    }

    .product-card p {
      font-size: 1.06rem;
      color: var(--text-muted);
      line-height: 1.72;
    }

    .product-footnote {
      text-align: center;
      margin-top: 3.2rem;
      font-size: 0.94rem;
      color: var(--text-soft);
    }

    /* 9. DETAILS ACCORDION */
    .faq-section {
      padding: 6rem 0;
      background: var(--bg-page);
    }

    .faq-header {
      text-align: center;
      margin-bottom: 3.2rem;
    }
    /* FAQ Title: +2pt increase */
    .faq-header h2 {
      font-size: clamp(2.2rem, 4.0vw, 3.05rem);
      font-weight: 700;
      letter-spacing: -0.03em;
    }

    .faq-list {
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 1.1rem;
    }

    /* FAQ Details: 24px + Glassmorphism */
    details {
      background: rgba(255, 255, 255, 0.78);
      backdrop-filter: blur(20px) saturate(160%);
      -webkit-backdrop-filter: blur(20px) saturate(160%);
      border-radius: 24px;
      padding: 1.45rem 1.95rem;
      border: 1px solid var(--border-glass);
      box-shadow: var(--shadow-glass);
      transition: all 0.25s ease;
    }
    details:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 36px rgba(25, 35, 20, 0.08);
    }
    details[open] {
      box-shadow: 0 18px 40px rgba(25, 35, 20, 0.09);
    }

    summary {
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--text-dark);
      cursor: pointer;
      list-style: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    summary::-webkit-details-marker {
      display: none;
    }
    summary::after {
      content: "+";
      font-size: 1.4rem;
      color: var(--green-primary);
      transition: transform 0.25s ease;
    }
    details[open] summary::after {
      content: "−";
    }

    details p {
      margin-top: 1.1rem;
      font-size: 1.04rem;
      color: var(--text-muted);
      line-height: 1.74;
      padding-top: 0.9rem;
      border-top: 1px solid rgba(45, 60, 35, 0.08);
    }

    /* 10. FINAL CTA - Emphasized Colored Area */
    .final-cta-section {
      padding: 4.5rem 0 7.5rem;
      background: var(--bg-page);
      position: relative;
    }

    .final-cta-card {
      background: linear-gradient(155deg, #24351d 0%, #152212 100%);
      border-radius: 44px;
      padding: 6.8rem 2.8rem;
      text-align: center;
      position: relative;
      overflow: hidden;
      box-shadow: 0 28px 70px rgba(24, 38, 19, 0.22);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .final-cta-card::before {
      content: '';
      position: absolute;
      top: -25%;
      left: 50%;
      transform: translateX(-50%);
      width: 760px;
      height: 520px;
      background: radial-gradient(circle, rgba(162, 204, 140, 0.24) 0%, transparent 68%);
      pointer-events: none;
      z-index: 1;
    }

    .final-cta-card .final-cta-content {
      position: relative;
      z-index: 2;
      max-width: 760px;
      margin: 0 auto;
    }

    .final-cta-card .eyebrow {
      display: inline-block;
      font-size: 0.88rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      color: #cfe2c4;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 0.42rem 1.15rem;
      border-radius: 9999px;
      margin-bottom: 1.6rem;
    }

    /* Final CTA Title: +2pt increase, luminous white */
    .final-cta-card h2 {
      font-size: clamp(2.8rem, 5.5vw, 4.45rem);
      font-weight: 800;
      line-height: 1.18;
      letter-spacing: -0.03em;
      color: #ffffff;
      margin-bottom: 1.5rem;
      text-shadow: 0 4px 24px rgba(0, 0, 0, 0.2);
    }

    /* Final CTA Body: +2pt increase, luminous white */
    .final-cta-card p {
      font-size: 1.25rem;
      color: rgba(255, 255, 255, 0.88);
      line-height: 1.72;
      margin-bottom: 2.8rem;
      max-width: 620px;
      margin-left: auto;
      margin-right: auto;
    }

    .final-cta-card .btn-primary {
      background: #ffffff;
      color: #1e2e18;
      font-weight: 700;
      font-size: 1.14rem;
      padding: 1.1rem 2.6rem;
      border-radius: 9999px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.28);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .final-cta-card .btn-primary:hover {
      background: #f4f7ee;
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
      color: #141f10;
    }

    /* Footer */
    .landing-footer {
      border-top: 1px solid rgba(45, 60, 35, 0.06);
      padding: 3.2rem 0;
      background: #ffffff;
    }

    .footer-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1.5rem;
    }

    .footer-copy {
      font-size: 0.88rem;
      color: var(--text-soft);
    }

    /* Modal: 32px + Glassmorphism (Centered Perfectly, Zero Clipping) */
    dialog#modal {
      border: 1px solid var(--border-glass);
      border-radius: 32px;
      padding: 1.85rem 2.4rem 1.75rem;
      max-width: 480px;
      width: min(92vw, 480px);
      max-height: 90vh;
      max-height: 90dvh;
      box-sizing: border-box;
      overflow-y: auto;
      overscroll-behavior: contain;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(32px) saturate(180%);
      -webkit-backdrop-filter: blur(32px) saturate(180%);
      box-shadow: 0 28px 70px rgba(0, 0, 0, 0.22), inset 0 1px 0 rgba(255, 255, 255, 0.95);
      position: fixed;
      inset: 0;
      margin: auto;
    }

    dialog#modal::-webkit-scrollbar {
      width: 5px;
    }
    dialog#modal::-webkit-scrollbar-track {
      background: transparent;
    }
    dialog#modal::-webkit-scrollbar-thumb {
      background: rgba(45, 60, 35, 0.16);
      border-radius: 9999px;
    }

    dialog#modal::backdrop {
      background: rgba(18, 22, 18, 0.6);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .close-btn {
      position: absolute;
      top: 1.15rem;
      right: 1.25rem;
      width: 34px;
      height: 34px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.04);
      font-size: 1.4rem;
      line-height: 1;
      color: var(--text-soft);
      cursor: pointer;
      border: none;
      transition: background 0.2s ease, color 0.2s ease, transform 0.15s ease;
      z-index: 2;
    }
    .close-btn:hover {
      background: rgba(0, 0, 0, 0.08);
      color: var(--text-dark);
      transform: scale(1.05);
    }

    .modal-head {
      margin-bottom: 1.05rem;
    }
    .modal-head .eyebrow {
      font-size: 0.72rem;
      letter-spacing: 0.14em;
      margin-bottom: 0.25rem;
    }
    .modal-head h2 {
      font-size: 1.68rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.3rem;
      line-height: 1.25;
    }
    .modal-head p {
      font-size: 0.92rem;
      color: var(--text-muted);
      line-height: 1.45;
    }

    .form-field {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
      margin-bottom: 0.8rem;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-dark);
      text-align: left;
    }

    .form-field input, .form-field select {
      width: 100%;
      padding: 0.72rem 1rem;
      border-radius: 13px;
      border: 1px solid rgba(45, 60, 35, 0.16);
      font-size: 0.92rem;
      font-family: inherit;
      background: rgba(255, 255, 255, 0.85);
      color: var(--text-dark);
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .form-field input:focus, .form-field select:focus {
      border-color: var(--green-primary);
      box-shadow: 0 0 0 3px rgba(74, 99, 62, 0.15);
    }

    .consent-label {
      display: flex;
      align-items: flex-start;
      gap: 0.55rem;
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-bottom: 1.1rem;
      text-align: left;
      cursor: pointer;
      line-height: 1.4;
    }
    .consent-label input {
      margin-top: 2px;
    }

    .btn-full {
      width: 100%;
    }

    /* Toast */
    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(20, 25, 20, 0.92);
      color: #ffffff;
      padding: 0.9rem 1.7rem;
      border-radius: 9999px;
      font-size: 0.95rem;
      font-weight: 600;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.25);
      z-index: 1000;
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
    }
    #toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* Responsive Breakpoints */
    @media (max-width: 1024px) {
      .hero-grid {
        grid-template-columns: 1fr;
        gap: 3.2rem;
        text-align: center;
      }
      .hero-content {
        max-width: 100%;
        margin: 0 auto;
      }
      .hero-actions {
        justify-content: center;
      }
      .lifestyle-grid {
        grid-template-columns: 1fr;
        gap: 3.2rem;
      }
      .heartbeat-feature-grid {
        grid-template-columns: 1fr;
        gap: 3.5rem;
      }
      .heartbeat-feature-copy {
        max-width: 680px;
      }
      .heartbeat-demo-shell {
        width: min(100%, 620px);
        margin: 0 auto;
      }
      .interruption-grid {
        grid-template-columns: 1fr;
        gap: 3.2rem;
      }
      .story-tabs {
        display: none !important;
      }
      .v9-experience {
        padding: 4rem 0 4.5rem;
      }
      .experience-header {
        margin-bottom: 1.8rem;
      }
      .experience-header h2 {
        font-size: clamp(1.8rem, 5.5vw, 2.3rem);
        margin-bottom: 0.6rem;
      }
      .experience-header p {
        font-size: 0.95rem;
        line-height: 1.5;
      }
      .s5-desktop-stage {
        display: none !important;
      }
      .s5-mobile-slider-wrap {
        display: block;
        width: 100%;
        max-width: 480px;
        margin: 0 auto;
      }
      .s5-mobile-slider {
        display: flex;
        overflow-x: auto;
        scroll-snap-type: x mandatory;
        scroll-padding-left: 1.5rem;
        -webkit-overflow-scrolling: touch;
        gap: 14px;
        padding: 0.6rem 0 1rem;
        margin: 0 -1.5rem;
        scrollbar-width: none;
      }
      .s5-mobile-slider::-webkit-scrollbar {
        display: none;
      }
      .s5-slide {
        flex: 0 0 calc(100vw - 84px);
        max-width: 326px;
        min-width: 275px;
        scroll-snap-align: start;
        display: flex;
        flex-direction: column;
        box-sizing: border-box;
      }
      .s5-slide:first-child {
        margin-left: 1.5rem;
      }
      .s5-slide:last-child {
        margin-right: 1.5rem;
      }
      .s5-slide .s5-phone {
        width: 100%;
        height: 405px;
        min-height: 405px;
        max-height: 405px;
        border-radius: 34px;
        padding: 1.4rem 1.35rem 1.25rem;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;

          const v = p.get(k);

        return u;

    const urlParams = new URLSearchParams(window.location.search);

    function toast(msg) {
      const el = $('#toast');

      el.classList.add('show');
      clearTimeout(window.toastTimer);
      window.toastTimer = setTimeout(() => el.classList.remove('show'), 3000);

    function modal(html) {
      const dialog = $('#modal');

      dialog.querySelector('[data-close]').onclick = () => dialog.close();

      return `

    function initMessageTypingAnimation() {
      const textEl = document.getElementById('lifestyle-typing-text');
      const bubbleEl = document.getElementById('lifestyle-msg-bubble');
      const cursorEl = bubbleEl ? bubbleEl.querySelector('.msg-typing-cursor') : null;
      if (!textEl || !bubbleEl) return;

      if (window._msgTypingTimer) {
        clearTimeout(window._msgTypingTimer);
        window._msgTypingTimer = null;
      }
      if (window._msgTypingObserver) {
        window._msgTypingObserver.disconnect();
        window._msgTypingObserver = null;
      }

      const isJa = (lang === 'ja');
      const fullText = isJa ? "よく眠れた？" : "잘 잤어?";

      if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        textEl.textContent = fullText;
        if (cursorEl) cursorEl.style.display = 'none';
        return;
      }

      // Natural typing cadence frames
      const koFrames = [
        { text: "ㅈ", delay: 110 },
        { text: "자", delay: 90 },
        { text: "잘", delay: 130 },
        { text: "잘 ", delay: 80 },
        { text: "잘 ㅈ", delay: 100 },
        { text: "잘 자", delay: 90 },
        { text: "잘 잤", delay: 140 },
        { text: "잘 잤ㅇ", delay: 100 },
        { text: "잘 잤어", delay: 120 },
        { text: "잘 잤어?", delay: 280 }
      ];

      const jaFrames = [
        { text: "よ", delay: 120 },
        { text: "よく", delay: 120 },
        { text: "よくね", delay: 120 },
        { text: "よくねむ", delay: 120 },
        { text: "よくねむれ", delay: 120 },
        { text: "よくねむれた", delay: 140 },
        { text: "よく眠れた", delay: 160 },
        { text: "よく眠れた？", delay: 280 }
      ];

      const frames = isJa ? jaFrames : koFrames;
      let hasRun = false;

      function runOnce() {
        if (hasRun) return;
        hasRun = true;
        let frameIdx = 0;
        textEl.textContent = "";
        if (cursorEl) {
          cursorEl.style.opacity = '1';
          cursorEl.style.display = 'inline-block';
        }

        function typeStep() {
          if (frameIdx < frames.length) {
            textEl.textContent = frames[frameIdx].text;
            const d = frames[frameIdx].delay;
            frameIdx++;
            window._msgTypingTimer = setTimeout(typeStep, d);
          } else {
            // Completed typing: subtle pop bounce
            bubbleEl.classList.remove('bubble-pop');
            void bubbleEl.offsetWidth;
            bubbleEl.classList.add('bubble-pop');

            // Softly fade out cursor after 1.2s to cleanly seal the delivered message
            window._msgTypingTimer = setTimeout(() => {
              if (cursorEl) {
                cursorEl.style.transition = 'opacity 0.4s ease';
                cursorEl.style.opacity = '0';
              }
            }, 1200);
          }
        }

        typeStep();
      }

      const section = bubbleEl.closest('.lifestyle-section');
      if (section && 'IntersectionObserver' in window) {
        window._msgTypingObserver = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting && !hasRun) {
              runOnce();
              window._msgTypingObserver.disconnect();
            }
          });
        }, { threshold: 0.25 });
        window._msgTypingObserver.observe(section);
      } else {
        runOnce();
      }
    }

    function initHeartbeatDemo() {
      const demo = document.querySelector('[data-heartbeat-demo]');
      const sendButton = document.querySelector('[data-heartbeat-send]');
      const status = document.querySelector('[data-heartbeat-status]');
      if (!demo || !sendButton || !status) return;

      if (window._heartbeatDemoTimer) {
        clearTimeout(window._heartbeatDemoTimer);
        window._heartbeatDemoTimer = null;
      }

      sendButton.onclick = () => {
        if (sendButton.disabled) return;
        sendButton.disabled = true;
        demo.classList.remove('is-sent');
        demo.classList.add('is-sending');
        demo.setAttribute('aria-busy', 'true');
        status.textContent = t('지우에게 심박을 보내는 중…', 'ジウへ心拍を送っています…');

        window._heartbeatDemoTimer = setTimeout(() => {
          demo.classList.remove('is-sending');
          demo.classList.add('is-sent');
          demo.setAttribute('aria-busy', 'false');
          status.textContent = t('지우가 느꼈어요. 작은 답장이 도착했어요.', 'ジウが受け取りました。小さな返事が届きました。');
          sendButton.disabled = false;
          sendButton.querySelector('span').textContent = t('한 번 더 보내기', 'もう一度送る');
        }, 920);
      };
    }

    function bind() {
      // 1. Story tabs interaction
      document.querySelectorAll('[data-visual]').forEach(btn => {
        btn.onclick = () => {
          visualMode = btn.dataset.visual;
          $('#s5-preview').innerHTML = visualPreview();
          document.querySelectorAll('[data-visual]').forEach(b => {
            b.setAttribute('aria-pressed', String(b === btn));
          });
        };
      });

      // 2. Action buttons (signup modal and language toggle)
      document.querySelectorAll('[data-action]').forEach(btn => {
        btn.onclick = () => {
          const action = btn.dataset.action;
          const interest = btn.dataset.interest;
          if (action === 'language') {
            lang = lang === 'ko' ? 'ja' : 'ko';
            try { sessionStorage.setItem('sai-lang', lang); } catch (_) {}
            render();
          } else if (action === 'signup') {
            signup(interest);
          }
        };
      });

      // 3. iMessage-style dynamic typing animation
      initMessageTypingAnimation();

      // 4. Signature heartbeat-send interaction preview
      initHeartbeatDemo();

      // 5. Mobile experience slider dots & touch interaction
      const slider = $('#s5MobileSlider');
      if (slider) {
        const dots = document.querySelectorAll('.s5-dots .s5-dot');
        dots.forEach(d => {
          d.onclick = () => {
            const idx = parseInt(d.dataset.goto, 10);
            const slides = slider.querySelectorAll('.s5-slide');
            if (slides[idx]) {
              slides[idx].scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'start' });
            }
          };
        });

        let scrollDebounce;
        slider.addEventListener('scroll', () => {
          clearTimeout(scrollDebounce);
          scrollDebounce = setTimeout(() => {
            const scrollLeft = slider.scrollLeft;
            const slide = slider.querySelector('.s5-slide');
            if (!slide) return;
            const slideW = slide.offsetWidth;
            const gap = 14;
            const currentIdx = Math.min(dots.length - 1, Math.max(0, Math.round(scrollLeft / (slideW + gap))));
            dots.forEach((dot, i) => {
              dot.classList.toggle('active', i === currentIdx);
            });
          }, 40);
        }, { passive: true });
      }
    }

    // STRICT INVARIANT: Always render landing page. NEVER render mockup or prototype views.
    function render() {
      document.documentElement.lang = lang;
      $('#root').innerHTML = landing();
      bind();
    }

    // Initial render
    render();

    // Support ?modal=signup for marketing links and previewing
    if (urlParams.get('modal') === 'signup') {
      signup(urlParams.get('interest'));
    }
  </script>
