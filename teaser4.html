<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SAI — 둘만을 위한 스마트링, 사이 (Teaser 4)</title>
  <meta name="description" content="잠든 밤은 나누고, 뛰는 지금은 보내요. 한국과 일본의 20대 커플을 위한 감성 스마트링, SAI.">
  <meta property="og:title" content="SAI — 둘만을 위한 스마트링, 사이">
  <meta property="og:description" content="둘만 아는 연결. 둘이 함께 쓰는 감성 커플 스마트링.">
  <meta property="og:image" content="/assets/product-rings-duo-clean.webp">
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <link rel="apple-touch-icon" href="/assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Pure White Tone Palette */
      --bg-page: #ffffff;
      --bg-surface: #ffffff;
      --bg-card: #ffffff;
      --bg-card-hover: #ffffff;
      --bg-dark: #ffffff;
      --bg-deep: #fafafa;
      --bg-glass: rgba(255, 255, 255, 0.95);
      --border-subtle: rgba(0, 0, 0, 0.07);
      --border-card: rgba(0, 0, 0, 0.08);
      --border-glow-violet: rgba(124, 58, 237, 0.16);
      --border-glow-red: rgba(229, 72, 87, 0.22);

      /* Refined Emotional Accents (Soft Warm Rose & Sage) */
      --red-primary: #e54857;
      --red-light: #ea5b69;
      --red-neon: #e54857;
      --red-glow: rgba(229, 72, 87, 0.16);
      --red-soft-bg: #fff1f3;

      --violet-primary: #7c3aed;
      --violet-light: #6d28d9;
      --violet-neon: #7c3aed;
      --violet-glow: rgba(124, 58, 237, 0.12);
      --violet-soft-bg: #f5f3ff;

      --gradient-electric: linear-gradient(135deg, #18181b 0%, #27272a 100%);
      --gradient-electric-hover: linear-gradient(135deg, #27272a 0%, #3f3f46 100%);
      --gradient-coral: linear-gradient(135deg, #e54857 0%, #fa6b78 100%);
      --gradient-coral-hover: linear-gradient(135deg, #d63d4c 0%, #f05967 100%);
      --gradient-text: linear-gradient(135deg, #18181b 0%, #e54857 100%);

      /* High Legibility Typography */
      --text-white: #18181b;
      --text-dark: #18181b;
      --text-muted: #52525b;
      --text-subtle: #71717a;
      --text-violet-tint: #4c1d95;
      --text-red-tint: #e54857;

      /* Elegant Warm Shadows */
      --shadow-electric: 0 10px 24px rgba(24, 24, 27, 0.15);
      --shadow-coral: 0 10px 24px rgba(229, 72, 87, 0.22);
      --shadow-card: 0 12px 36px rgba(25, 20, 15, 0.05), 0 2px 8px rgba(25, 20, 15, 0.03);
      --shadow-float: 0 16px 40px rgba(25, 20, 15, 0.08);

      --font-sans: 'Pretendard', 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      width: 100%;
      overflow-x: hidden;
      background-color: var(--bg-page);
      color: var(--text-dark);
      font-family: var(--font-sans);
      line-height: 1.5;
      letter-spacing: -0.02em;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      position: relative;
    }

    /* Ambient atmospheric soft subtle glow */
    body::before {
      content: '';
      position: fixed;
      top: -15vw;
      left: 10vw;
      width: 50vw;
      height: 50vw;
      background: radial-gradient(circle, rgba(245, 245, 250, 0.4) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
      filter: blur(80px);
    }
    body::after {
      content: '';
      position: fixed;
      top: 30vh;
      right: -10vw;
      width: 55vw;
      height: 55vw;
      background: radial-gradient(circle, rgba(254, 242, 242, 0.25) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
      filter: blur(90px);
    }

    h1, h2, h3, h4, p, span, blockquote {
      word-break: keep-all;
      overflow-wrap: break-word;
    }

    :lang(ja) {
      word-break: normal;
      line-break: strict;
    }

    img {
      max-width: 100%;
      height: auto;
      display: block;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      outline: none;
      background: none;
      transition: all 0.28s cubic-bezier(0.16, 1, 0.3, 1);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container, .container-wide {
      width: 100%;
      max-width: 1160px;
      margin: 0 auto;
      padding: 0 2.5rem;
      position: relative;
      z-index: 1;
      box-sizing: border-box;
    }

    /* Text Accent */
    .gradient-text {
      background: var(--gradient-text);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: inline-block;
    }
    .hero-accent {
      background: linear-gradient(135deg, #4a1922 0%, #d84555 50%, #e54857 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: inline-block;
    }

    /* Badges & Pills */
    .gradient-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 0.42rem 1.15rem;
      border-radius: 9999px;
      background: #ffffff;
      border: 1px solid rgba(0, 0, 0, 0.08);
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: var(--text-dark);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
      margin-bottom: 1.25rem;
    }

    .gradient-pill.red {
      background: var(--red-soft-bg);
      border-color: rgba(229, 72, 87, 0.25);
      color: var(--red-primary);
      box-shadow: 0 2px 8px rgba(229, 72, 87, 0.06);
    }

    /* Buttons */
    .btn-gradient {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--gradient-electric);
      color: #ffffff;
      padding: 1.05rem 2.2rem;
      border-radius: 9999px;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      box-shadow: var(--shadow-electric);
      transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.28s ease, filter 0.28s ease;
      position: relative;
      overflow: hidden;
    }
    .btn-gradient::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--gradient-electric-hover);
      opacity: 0;
      transition: opacity 0.28s ease;
    }
    .btn-gradient span {
      position: relative;
      z-index: 1;
    }
    .btn-gradient:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 16px 36px rgba(24, 24, 27, 0.25);
    }
    .btn-gradient:hover::before {
      opacity: 1;
    }
    .btn-gradient:active {
      transform: translateY(0);
    }

    .btn-coral {
      background: var(--gradient-coral) !important;
      box-shadow: var(--shadow-coral) !important;
    }
    .btn-coral:hover {
      box-shadow: 0 16px 36px rgba(229, 72, 87, 0.35) !important;
    }

    .btn-glass {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: #ffffff;
      color: var(--text-dark);
      border: 1px solid rgba(0, 0, 0, 0.12);
      padding: 1.05rem 2.0rem;
      border-radius: 9999px;
      font-size: 1.02rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
      transition: all 0.28s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .btn-glass:hover {
      background: #fdfdfd;
      border-color: rgba(0, 0, 0, 0.25);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
    }

    /* GNB Header */
    .teaser-nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      background: rgba(250, 249, 246, 0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(0, 0, 0, 0.06);
      padding: 1.0rem 0;
      transition: background 0.3s ease;
    }
    .teaser-nav-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand-logo {
      display: inline-flex;
      align-items: center;
      text-decoration: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }
    .brand-logo:hover {
      opacity: 0.85;
      transform: translateY(-1px);
    }
    .brand-logo img, .brand-logo-img {
      height: 34px;
      width: auto;
      display: block;
      object-fit: contain;
    }
    .nav-actions {
      display: flex;
      align-items: center;
      gap: 1.25rem;
    }
    .nav-link {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-muted);
      transition: color 0.2s ease;
    }
    .nav-link:hover {
      color: var(--text-dark);
    }
    .lang-toggle {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--text-dark);
      border: 1px solid rgba(0, 0, 0, 0.12);
      background: #ffffff;
      padding: 0.42rem 0.95rem;
      border-radius: 9999px;
      letter-spacing: 0.06em;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.03);
      transition: all 0.2s ease;
    }
    .lang-toggle:hover {
      border-color: rgba(0, 0, 0, 0.25);
      transform: translateY(-1px);
    }
    .nav-btn-sm {
      padding: 0.65rem 1.4rem;
      font-size: 0.9rem;
    }

    /* 01. HERO SECTION */
    .hero-section {
      position: relative;
      min-height: clamp(660px, 90vh, 850px);
      display: flex;
      align-items: center;
      padding: 6.0rem 0 3.5rem;
      overflow: hidden;
      background: var(--bg-page);
    }

    /* Desktop Hero Stage */
    .hero-content-container {
      position: relative;
      z-index: 3;
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      gap: 3.5rem;
    }
    .hero-content-left {
      max-width: 520px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      text-align: left;
    }
    .hero-eyebrow {
      font-size: 0.88rem;
      font-weight: 600;
      color: #666666;
      letter-spacing: -0.01em;
      margin-bottom: 0.9rem;
      display: inline-block;
    }
    .hero-title {
      font-size: clamp(3.42rem, 5.7vw, 4.82rem);
      font-weight: 900;
      line-height: 1.15;
      letter-spacing: -0.035em;
      margin: 0 0 1.2rem 0;
      color: #1a1a1a;
      text-align: left;
    }
    .hero-title .hero-accent {
      background: linear-gradient(135deg, #4a1922 0%, #d84555 50%, #e54857 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: inline-block;
      font-style: normal;
      font-weight: 900;
    }
    .hero-desc {
      font-size: 1.15rem;
      line-height: 1.68;
      color: #4a4a4a;
      margin-bottom: 2.2rem;
      max-width: 490px;
      text-align: left;
    }
    .hero-cta-group {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-start;
      gap: 1rem;
      align-items: center;
    }
    .hero-btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background-color: #18181b;
      color: #ffffff;
      padding: 0.88rem 1.85rem;
      font-size: 0.98rem;
      font-weight: 600;
      border-radius: 9999px;
      border: 1px solid #18181b;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.16);
      transition: all 0.25s ease;
      text-decoration: none;
    }
    .hero-btn-primary:hover {
      background-color: #27272a;
      border-color: #27272a;
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.24);
    }
    .hero-btn-secondary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background-color: #ffffff;
      color: #18181b;
      border: 1px solid rgba(0, 0, 0, 0.15);
      padding: 0.88rem 1.85rem;
      font-size: 0.98rem;
      font-weight: 500;
      border-radius: 9999px;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
      transition: all 0.25s ease;
      text-decoration: none;
    }
    .hero-btn-secondary:hover {
      background-color: #f4f4f5;
      border-color: rgba(0, 0, 0, 0.28);
      transform: translateY(-2px);
      color: #000000;
    }

    /* Ritual Bar below Hero */
    .teaser-ritual {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      padding: 1.15rem 1rem;
      border-top: 1px solid rgba(0, 0, 0, 0.06);
      border-bottom: 1px solid rgba(0, 0, 0, 0.06);
      background: rgba(255, 255, 255, 0.45);
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--text-muted);
    }
    .teaser-ritual span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .teaser-ritual i {
      font-style: normal;
      opacity: 0.4;
    }

    /* Right Art Stage with Live Ring Illustration & Motion */
    .hero-art {
      position: relative;
      flex: 1;
      max-width: 520px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .hero-art-img {
      width: 100%;
      max-width: 480px;
      aspect-ratio: 1 / 1 !important;
      object-fit: contain !important;
      filter: drop-shadow(0 24px 44px rgba(35, 45, 30, 0.08));
      animation: heroRingFloat 7s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }
    @keyframes heroRingFloat {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-9px) scale(1.008); }
    }

    /* Floating notes: Glassmorphism + 20px rounded + distinct gentle micro-motion */
    .hero-art .floating-note {
      position: absolute;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.95);
      border-radius: 20px;
      padding: 0.85rem 1.35rem;
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--text-dark);
      box-shadow: 0 12px 32px rgba(35, 45, 30, 0.07);
      display: flex;
      flex-direction: column;
      gap: 3px;
      z-index: 3;
      transition: transform 0.3s ease;
    }
    .hero-art .floating-note:hover {
      transform: scale(1.03);
    }
    .hero-art .floating-note.top {
      top: 5%;
      left: -15px;
      border-color: rgba(124, 58, 237, 0.2);
      animation: floatTopNote 6s ease-in-out infinite alternate;
    }
    .hero-art .floating-note.bottom {
      bottom: 7%;
      right: -10px;
      border-color: rgba(229, 72, 87, 0.22);
      animation: floatBottomNote 6.5s ease-in-out infinite alternate;
    }
    .hero-art .floating-note small {
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--text-soft);
    }
    @keyframes floatTopNote {
      0% { transform: translateY(0px) rotate(0deg); }
      100% { transform: translateY(-8px) rotate(0.4deg); }
    }
    @keyframes floatBottomNote {
      0% { transform: translateY(0px) rotate(0deg); }
      100% { transform: translateY(8px) rotate(-0.4deg); }
    }
    .pill-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      flex-shrink: 0;
    }
    .pill-icon.violet {
      background: var(--violet-soft-bg);
      color: var(--violet-primary);
    }
    .pill-icon.red {
      background: var(--red-soft-bg);
      color: var(--red-primary);
    }
    .pill-text {
      display: flex;
      flex-direction: column;
    }
    .pill-title {
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--text-dark);
    }
    .pill-sub {
      font-size: 0.78rem;
      color: var(--text-subtle);
    }

    @keyframes floatSmooth {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-8px); }
    }

    /* 02. SECTION: SLEEP SHARE */
    .section-wrap {
      padding: 7.0rem 0 5.5rem;
      position: relative;
      scroll-margin-top: 75px;
      background: #ffffff;
    }
    .section-head {
      max-width: 680px;
      padding-top: 1.2rem;
      margin-bottom: 3.2rem;
    }
    .section-title {
      font-size: clamp(2.42rem, 3.6vw, 3.12rem);
      font-weight: 900;
      line-height: 1.25;
      letter-spacing: -0.03em;
      margin: 0 0 0.9rem 0;
      color: var(--text-dark);
    }
    .section-desc {
      font-size: 1.05rem;
      color: var(--text-muted);
      line-height: 1.6;
    }

    /* Typing Message Bubble */
    .typing-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #f3e8ff;
      border: 1px solid #d8b4fe;
      color: #6b21a8;
      padding: 0.2rem 0.85rem;
      border-radius: 9999px;
      font-weight: 800;
      font-size: 0.95em;
      box-shadow: 0 2px 8px rgba(124, 58, 237, 0.08);
      vertical-align: baseline;
    }
    .typing-cursor {
      display: inline-block;
      width: 2px;
      height: 1.05em;
      background-color: #7c3aed;
      animation: blinkCursor 0.85s steps(1) infinite;
      vertical-align: middle;
    }
    @keyframes blinkCursor {
      50% { opacity: 0; }
    }

    /* Cinematic Sleep Share Container (Extra Large 16:9) */
    .cinematic-frame {
      position: relative;
      width: 100%;
      border-radius: 36px;
      overflow: hidden;
      background: #11121b;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: var(--shadow-card);
      min-height: 520px;
      display: flex;
      align-items: flex-end;
    }
    .cinematic-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      filter: brightness(0.88);
      transition: transform 0.6s ease;
    }
    .cinematic-frame:hover .cinematic-img {
      transform: scale(1.03);
    }
    .cinematic-overlay-gradient {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(8, 8, 12, 0.1) 0%, rgba(8, 8, 12, 0.75) 100%);
      pointer-events: none;
    }

    /* Glass Status Card inside Cinematic Frame */
    .sleep-overlay-card {
      position: relative;
      z-index: 2;
      margin: 2.5rem;
      max-width: 440px;
      background: rgba(14, 15, 24, 0.85);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(124, 58, 237, 0.35);
      border-radius: 28px;
      padding: 1.8rem 2.0rem;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(124, 58, 237, 0.15);
      color: #ffffff;
    }
    .sleep-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.2rem;
    }
    .sleep-card-label {
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      color: #ddd6fe;
    }
    .sleep-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 0.76rem;
      font-weight: 700;
      color: #a855f7;
      background: rgba(124, 58, 237, 0.2);
      padding: 0.25rem 0.65rem;
      border-radius: 9999px;
      border: 1px solid rgba(124, 58, 237, 0.4);
    }
    .sleep-card-hours {
      font-size: 2.8rem;
      font-weight: 900;
      line-height: 1;
      letter-spacing: -0.03em;
      color: #fff;
      margin-bottom: 0.6rem;
    }
    .sleep-card-status-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
      color: #94a3b8;
      padding-top: 0.8rem;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }
    .sleep-card-status-row strong {
      color: #fff;
      font-weight: 700;
    }

    /* Privacy Banner */
    .privacy-tag-box {
      margin-top: 1.6rem;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 0.85rem 1.4rem;
      border-radius: 18px;
      background: #ffffff;
      border: 1px solid rgba(0, 0, 0, 0.08);
      font-size: 0.90rem;
      color: var(--text-muted);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
    }
    .privacy-icon {
      color: #7c3aed;
      font-size: 1.1rem;
      font-weight: 800;
    }
    .privacy-tag-box strong {
      color: var(--text-dark);
    }

    /* 03. SECTION: SEND A BEAT */
    .beat-studio-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr);
      gap: 3.5rem;
      align-items: center;
      width: 100%;
    }
    .beat-card-wrap {
      position: relative;
      background: radial-gradient(circle at 50% 30%, rgba(229, 72, 87, 0.05) 0%, #ffffff 80%);
      border: 1px solid rgba(229, 72, 87, 0.20);
      border-radius: 36px;
      padding: 2.8rem 2.4rem;
      box-shadow: var(--shadow-card), 0 0 35px rgba(229, 72, 87, 0.06);
      text-align: center;
      overflow: hidden;
      min-height: 500px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 100%;
      box-sizing: border-box;
    }

    /* Pulse Expanding Wave on Beat Send */
    .beat-ripple {
      position: absolute;
      top: 42%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 140px;
      height: 140px;
      border-radius: 50%;
      pointer-events: none;
      opacity: 0;
      z-index: 1;
    }
    .beat-ripple.active {
      animation: rippleWave 1.6s cubic-bezier(0.1, 0.8, 0.3, 1) infinite;
    }
    @keyframes rippleWave {
      0% {
        width: 120px;
        height: 120px;
        opacity: 0.85;
        border: 2px solid var(--red-primary);
        box-shadow: 0 0 25px rgba(229, 72, 87, 0.4);
      }
      100% {
        width: 550px;
        height: 550px;
        opacity: 0;
        border: 1px solid rgba(229, 72, 87, 0.2);
        box-shadow: 0 0 50px transparent;
      }
    }

    .heart-stage-wrap {
      position: relative;
      z-index: 2;
      margin: 1.2rem 0;
    }
    .heart-3d-visual {
      width: 130px;
      height: 130px;
      object-fit: contain;
      margin: 0 auto;
      filter: drop-shadow(0 15px 30px rgba(229, 72, 87, 0.3));
      animation: heartbeatPulse 1.6s cubic-bezier(0.25, 0.1, 0.25, 1) infinite;
      transform-origin: center;
    }
    @keyframes heartbeatPulse {
      0% {
        transform: scale(1);
        filter: drop-shadow(0 12px 25px rgba(229, 72, 87, 0.25));
      }
      12% {
        transform: scale(1.10);
        filter: drop-shadow(0 18px 35px rgba(229, 72, 87, 0.45));
      }
      24% {
        transform: scale(1);
        filter: drop-shadow(0 12px 25px rgba(229, 72, 87, 0.25));
      }
      36% {
        transform: scale(1.15);
        filter: drop-shadow(0 20px 40px rgba(229, 72, 87, 0.5));
      }
      65% {
        transform: scale(1);
        filter: drop-shadow(0 12px 25px rgba(229, 72, 87, 0.25));
      }
      100% {
        transform: scale(1);
        filter: drop-shadow(0 12px 25px rgba(229, 72, 87, 0.25));
      }
    }

    .bpm-display {
      font-size: 3.4rem;
      font-weight: 900;
      letter-spacing: -0.04em;
      line-height: 1;
      color: var(--text-dark);
      margin: 1.0rem 0 0.4rem;
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 8px;
    }
    .bpm-unit {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--red-primary);
      letter-spacing: 0.05em;
    }

    .beat-status-msg {
      font-size: 0.95rem;
      color: var(--text-muted);
      min-height: 26px;
      margin-bottom: 3.4rem;
      position: relative;
      z-index: 12;
      transition: color 0.3s ease;
    }
    .beat-status-msg.sent {
      color: var(--red-primary);
      font-weight: 700;
    }

    /* Send Button Interactive & Tooltip */
    .beat-btn-wrapper {
      position: relative;
      width: 100%;
      max-width: 320px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .beat-tooltip {
      position: absolute;
      bottom: calc(100% + 4px);
      left: 50%;
      transform: translateX(-50%);
      background: var(--red-primary);
      color: #fff;
      padding: 0.26rem 0.72rem;
      border-radius: 9999px;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      box-shadow: 0 6px 16px rgba(229, 72, 87, 0.32);
      border: 1px solid rgba(255, 255, 255, 0.35);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: inline-flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
      pointer-events: none;
      z-index: 10;
      animation: tooltipFloat 2.2s ease-in-out infinite alternate;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }
    .beat-tooltip .tooltip-badge {
      font-size: 0.72rem;
      line-height: 1;
    }
    .beat-tooltip .tooltip-text {
      font-size: 0.72rem;
      font-weight: 700;
      line-height: 1;
    }
    .beat-tooltip .tooltip-arrow {
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 4px solid transparent;
      border-right: 4px solid transparent;
      border-top: 5px solid var(--red-primary);
    }
    @keyframes tooltipFloat {
      0% { transform: translate(-50%, 0); }
      100% { transform: translate(-50%, -2px); }
    }
    .btn-beat-send {
      width: 100%;
      max-width: 320px;
      padding: 1.1rem;
      font-size: 1.05rem;
      font-weight: 800;
      border-radius: 9999px;
      background: var(--red-primary);
      color: #fff;
      box-shadow: 0 10px 25px rgba(229, 72, 87, 0.35);
      transition: all 0.28s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      z-index: 5;
    }
    .btn-beat-send:hover {
      background: #d63d4c;
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 16px 35px rgba(229, 72, 87, 0.45);
    }
    .btn-beat-send:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    /* 3-Step Flow Pills */
    .beat-steps-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      width: 100%;
      margin-top: 1.8rem;
      z-index: 2;
    }
    .beat-step-pill {
      background: #FAF9F6;
      border: 1px solid rgba(0, 0, 0, 0.08);
      border-radius: 14px;
      padding: 0.65rem 0.5rem;
      font-size: 0.78rem;
      color: var(--text-subtle);
      transition: all 0.25s ease;
    }
    .beat-step-pill.active {
      background: var(--red-soft-bg);
      border-color: rgba(229, 72, 87, 0.35);
      color: var(--red-primary);
      font-weight: 700;
      box-shadow: 0 2px 10px rgba(229, 72, 87, 0.1);
    }

    /* 03. SECTION: SLEEP GARDEN */
    .garden-studio-grid {
      display: grid;
      grid-template-columns: 1fr 1.15fr;
      gap: 3.5rem;
      align-items: center;
    }
    .garden-media-stage {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      position: relative;
    }
    .garden-rings-img {
      width: 100%;
      max-width: 580px;
      height: auto !important;
      aspect-ratio: 3 / 2 !important;
      object-fit: contain !important;
      display: block;
      filter: drop-shadow(0 20px 45px rgba(0, 0, 0, 0.06));
      transition: transform 0.4s ease;
    }
    .garden-rings-img:hover {
      transform: translateY(-4px);
    }

    /* 04. SECTION: WIDE HORIZONTAL STORY SLIDER */
    .story-slider-outer {
      width: 100%;
      position: relative;
      overflow: visible;
      margin-top: 1.5rem;
    }
    .story-slider-track {
      display: flex;
      gap: 1.8rem;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      /* Left margin matches the standard container start line: */
      padding-left: max(2.5rem, calc((100vw - 1160px) / 2 + 2.5rem));
      padding-right: max(2.5rem, calc((100vw - 1160px) / 2 + 2.5rem));
      padding-top: 0.8rem;
      padding-bottom: 2.2rem;
    }
    .story-slider-track::-webkit-scrollbar {
      display: none;
    }

    .story-slide-card {
      position: relative;
      flex: 0 0 clamp(500px, 46vw, 620px);
      width: clamp(500px, 46vw, 620px);
      height: 520px;
      scroll-snap-align: start;
      border-radius: 32px;
      overflow: hidden;
      background: #111218;
      border: 1px solid rgba(0, 0, 0, 0.08);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.08);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 2.6rem 2.4rem;
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.4s ease;
      cursor: grab;
      user-select: none;
    }
    .story-slide-card:active {
      cursor: grabbing;
    }
    .story-slide-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 24px 55px rgba(0, 0, 0, 0.12);
    }

    .story-card-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 46%;
      filter: brightness(0.88);
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), filter 0.6s ease;
      transform: scale(1.02);
    }
    .story-slide-card:nth-child(1) .story-card-bg {
      object-position: center 46%;
    }
    .story-slide-card:nth-child(2) .story-card-bg {
      object-position: center 48%;
    }
    .story-slide-card:nth-child(3) .story-card-bg {
      object-position: center 48%;
    }
    .story-slide-card:hover .story-card-bg {
      transform: scale(1.06);
      filter: brightness(0.92);
    }

    .story-card-gradient {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, transparent 32%, rgba(10, 10, 14, 0.55) 60%, rgba(10, 10, 14, 0.92) 100%);
      pointer-events: none;
    }

    .story-card-content {
      position: relative;
      z-index: 2;
    }
    .story-tag {
      font-size: 0.80rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #ddd6fe;
      margin-bottom: 0.75rem;
    }
    .story-tag.red {
      color: #fecdd3;
    }
    .story-card-title {
      font-size: 1.62rem;
      font-weight: 900;
      line-height: 1.32;
      letter-spacing: -0.02em;
      margin-bottom: 0.7rem;
      color: #ffffff;
    }
    .story-card-desc {
      font-size: 0.98rem;
      color: rgba(255, 255, 255, 0.85);
      line-height: 1.5;
    }

    /* Slider Pagination Only */
    .story-slider-pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin-top: 0.5rem;
    }
    .story-slider-dot {
      width: 10px;
      height: 10px;
      border-radius: 9999px;
      background: rgba(0, 0, 0, 0.18);
      border: none;
      padding: 0;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .story-slider-dot:hover {
      background: rgba(0, 0, 0, 0.35);
    }
    .story-slider-dot.active {
      width: 32px;
      background: #1a1a1a;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
    }

    /* 04-A. OUR RHYTHM ARCHIVE */
    .rhythm-archive-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 3.5rem;
      align-items: stretch;
      margin-top: 3.0rem;
    }
    .rhythm-left-col {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      height: 100%;
    }
    .rhythm-photo-card {
      position: relative;
      border-radius: 32px;
      overflow: hidden;
      border: 1px solid rgba(0, 0, 0, 0.08);
      box-shadow: var(--shadow-card);
      width: 100%;
      height: 100%;
      min-height: 480px;
      flex: 1;
      display: flex;
    }
    .rhythm-photo-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.6s ease;
    }
    .rhythm-photo-card:hover .rhythm-photo-img {
      transform: scale(1.03);
    }
    .calendar-card {
      background: #ffffff;
      border: 1px solid rgba(0, 0, 0, 0.08);
      border-radius: 32px;
      padding: 2.4rem 2.2rem;
      box-shadow: var(--shadow-card);
    }
    .calendar-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.8rem;
    }
    .calendar-title-tag {
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.10em;
      color: var(--text-muted);
      text-transform: uppercase;
      display: block;
      margin-bottom: 0.25rem;
    }
    .calendar-month {
      font-size: 1.45rem;
      font-weight: 800;
      color: var(--text-dark);
    }
    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      text-align: center;
    }
    .cal-weekday {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--text-subtle);
      padding-bottom: 0.6rem;
    }
    .cal-day {
      min-height: 42px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-dark);
      border-radius: 12px;
      border: 1px solid transparent;
      cursor: pointer;
      position: relative;
      transition: all 0.2s ease;
    }
    .cal-day:hover {
      background: #FAF9F6;
    }
    .cal-day.empty {
      pointer-events: none;
      opacity: 0;
    }
    .cal-day.active {
      background: var(--red-primary);
      color: #fff;
      font-weight: 800;
      box-shadow: 0 4px 14px rgba(229, 72, 87, 0.35);
    }
    .cal-day.cycle {
      border: 1px dashed rgba(229, 72, 87, 0.45);
      background: var(--red-soft-bg);
      color: var(--red-primary);
    }
    .cal-dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--red-primary);
      position: absolute;
      bottom: 4px;
    }
    .cal-note-card {
      background: #FAF9F6;
      border: 1px solid rgba(0, 0, 0, 0.07);
      border-radius: 20px;
      padding: 1.2rem 1.4rem;
      margin-top: 1.6rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .cal-note-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: var(--red-soft-bg);
      color: var(--red-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      flex-shrink: 0;
    }
    .cal-note-meta {
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--text-subtle);
      margin-bottom: 0.2rem;
      text-transform: uppercase;
    }
    .cal-note-title {
      font-size: 1.02rem;
      font-weight: 800;
      color: var(--text-dark);
      margin-bottom: 0.2rem;
    }
    .cal-note-desc {
      font-size: 0.85rem;
      color: var(--red-primary);
      font-weight: 600;
    }

    /* 04-C. PRODUCT & MEMBERSHIP */
    .product-pills-row {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 1.0rem;
      margin: 2.0rem 0 3.5rem;
    }
    .product-cards-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2.5rem;
    }
    .product-glass-card {
      background: #ffffff;
      border: 1px solid rgba(0, 0, 0, 0.08);
      border-radius: 36px;
      padding: 3.2rem 2.8rem;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      box-shadow: var(--shadow-card);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .product-glass-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.08);
    }
    .product-card-head {
      margin-bottom: 2.0rem;
      text-align: left;
    }
    .product-card-num {
      font-size: 0.80rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      color: var(--red-primary);
      text-transform: uppercase;
      margin-bottom: 0.6rem;
    }
    .product-card-title {
      font-size: 1.85rem;
      font-weight: 800;
      color: var(--text-dark);
      margin-bottom: 0.8rem;
      letter-spacing: -0.02em;
    }
    .product-card-desc {
      font-size: 0.96rem;
      line-height: 1.5;
      color: var(--text-muted);
    }
    .product-card-media {
      margin-top: auto;
      padding-top: 2.0rem;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 250px;
    }
    .product-duo-ring-img {
      max-width: 290px;
      width: 100%;
      height: auto;
      aspect-ratio: 1 / 1 !important;
      object-fit: contain !important;
      filter: drop-shadow(0 16px 32px rgba(0, 0, 0, 0.08));
      animation: floatSmooth 5.5s ease-in-out infinite alternate;
    }
    .product-glass-card:nth-child(2) .product-card-media {
      margin-top: 1.2rem;
      padding-top: 1.0rem;
      padding-bottom: 2.8rem;
      min-height: 220px;
    }
    .product-heart-img {
      max-width: 135px;
      width: 100%;
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0 15px 35px rgba(229, 72, 87, 0.25));
      animation: heartbeatPulse 1.6s cubic-bezier(0.25, 0.1, 0.25, 1) infinite;
      transform-origin: center center;
    }

    /* 04-D. QUESTIONS (FAQ) */
    #questions .section-head {
      text-align: center;
      margin-left: auto;
      margin-right: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .faq-accordion-list {
      max-width: 820px;
      margin: 3.0rem auto 0;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }
    .faq-item {
      background: #ffffff;
      border: 1px solid rgba(0, 0, 0, 0.08);
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.02);
      transition: border-color 0.25s ease, background 0.25s ease;
    }
    .faq-item:hover {
      border-color: rgba(0, 0, 0, 0.18);
    }
    .faq-item.open {
      border-color: rgba(229, 72, 87, 0.35);
      background: #ffffff;
      box-shadow: 0 8px 25px rgba(229, 72, 87, 0.08);
    }
    .faq-question-btn {
      width: 100%;
      background: transparent;
      border: none;
      padding: 1.5rem 1.8rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      font-size: 1.12rem;
      font-weight: 700;
      color: var(--text-dark);
      text-align: left;
      gap: 1.2rem;
    }
    .faq-toggle-icon {
      font-size: 1.35rem;
      font-weight: 300;
      color: var(--red-primary);
      transition: transform 0.3s ease;
      line-height: 1;
    }
    .faq-item.open .faq-toggle-icon {
      transform: rotate(45deg);
    }
    .faq-answer {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.35s ease, padding 0.35s ease;
      padding: 0 1.8rem;
      font-size: 0.96rem;
      line-height: 1.5;
      color: var(--text-muted);
      text-align: left;
    }
    .faq-item.open .faq-answer {
      max-height: 250px;
      padding: 0 1.8rem 1.6rem;
    }

    /* 05. SECTION: FINAL CONVERSION */
    .cta-banner-wrap {
      margin: 6.0rem 0 4.0rem;
      position: relative;
      border-radius: 40px;
      background: linear-gradient(180deg, #ffffff 0%, #fff7f8 100%);
      border: 1px solid rgba(229, 72, 87, 0.20);
      padding: 5.0rem 2.0rem;
      text-align: center;
      overflow: hidden;
      box-shadow: var(--shadow-card), 0 20px 60px rgba(229, 72, 87, 0.06);
    }
    .cta-ring-img {
      max-width: 290px;
      margin: 0 auto 2.2rem;
      aspect-ratio: 1 / 1 !important;
      object-fit: contain !important;
      filter: drop-shadow(0 16px 32px rgba(0, 0, 0, 0.08));
      animation: floatSmooth 5s ease-in-out infinite alternate;
    }
    .cta-title {
      font-size: clamp(2.82rem, 5.5vw, 4.22rem);
      font-weight: 900;
      line-height: 1.18;
      letter-spacing: -0.03em;
      margin-bottom: 1.2rem;
      color: var(--text-dark);
    }
    .cta-desc {
      font-size: clamp(1.05rem, 1.6vw, 1.25rem);
      line-height: 1.5;
      color: var(--text-muted);
      max-width: 620px;
      margin: 0 auto 2.4rem;
    }

    /* Footer */
    .teaser-footer {
      padding: 3.5rem 0 5.0rem;
      border-top: 1px solid rgba(0, 0, 0, 0.06);
      font-size: 0.88rem;
      color: var(--text-subtle);
    }
    .footer-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1.5rem;
    }
    .footer-brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
    }

      m.showModal();

        if (e.target === m) m.close();
      };

    function initEvents() {
      // Language Toggle
      $('#lang-btn').onclick = () => {
        lang = lang === 'ko' ? 'ja' : 'ko';
        try { sessionStorage.setItem('sai-lang', lang); } catch (_) {}
        document.documentElement.lang = lang;
        renderPage();
      };

      // Modal Triggers
      $('#nav-signup-btn').onclick = openSignupModal;
      const heroBtn = $('#hero-signup-btn');
      if (heroBtn) heroBtn.onclick = openSignupModal;
      $('#bottom-signup-btn').onclick = openSignupModal;

      // Modal Triggers for sub sections
      $$('.rhythm-archive-btn').forEach(btn => btn.onclick = openSignupModal);

      // FAQ Accordion Interaction
      $$('.faq-question-btn').forEach(btn => {
        btn.onclick = () => {
          const item = btn.closest('.faq-item');
          const wasOpen = item.classList.contains('open');
          $$('.faq-item').forEach(el => el.classList.remove('open'));
          if (!wasOpen) item.classList.add('open');
        };
      });

      // Calendar Day Selection Interaction
      $$('.cal-day:not(.empty)').forEach(day => {
        day.onclick = () => {
          $$('.cal-day').forEach(d => d.classList.remove('active'));
          day.classList.add('active');
        };
      });

      // Heartbeat Send Interactive Demo
      const beatBtn = $('#beat-btn');
      const beatRipple = $('#beat-ripple');
      const beatMsg = $('#beat-msg');
      const step1 = $('#step-1');
      const step2 = $('#step-2');
      const step3 = $('#step-3');

      let sending = false;
      beatBtn.onclick = () => {
        if (sending) return;
        const tooltip = $('#beat-tooltip');
        if (tooltip) tooltip.style.opacity = '0';
        sending = true;
        beatBtn.disabled = true;

        // Stage 2: Sending
        beatRipple.classList.add('active');
        step1.classList.remove('active');
        step2.classList.add('active');
        beatBtn.innerHTML = `<span>${t('지우에게 전송 중... ♡', 'ジウへ送信中... ♡')}</span>`;
        beatMsg.textContent = t('지우의 스마트링으로 심박을 보내고 있어요...', 'ジウのスマートリングへ心拍を届けています...');
        beatMsg.classList.remove('sent');

        setTimeout(() => {
          // Stage 3: Received
          step2.classList.remove('active');
          step3.classList.add('active');
          beatRipple.classList.remove('active');
          beatMsg.textContent = t('지우가 느꼈어요! 작은 답장이 도착했습니다. ♡', 'ジウが感じました！小さな返事が届きました。♡');
          beatMsg.classList.add('sent');
          beatBtn.disabled = false;
          beatBtn.innerHTML = `<span>${t('한 번 더 보내기 ↗', 'もう一度送る ↗')}</span>`;
          sending = false;
        }, 1800);
      };

      // Typing motion for sleep share
      initTyping();

      // Horizontal wide story slider
      initStorySlider();
    }

    function initStorySlider() {
      const track = $('#storySliderTrack');
      const dots = $$('#storySliderDots .story-slider-dot');
      if (!track || dots.length === 0) return;

      const cards = $$('.story-slide-card');

      // Click dot to scroll to corresponding card
      dots.forEach((dot, index) => {
        dot.onclick = () => {
          if (cards[index]) {
            const cardLeft = cards[index].offsetLeft;
            const trackPaddingLeft = parseFloat(window.getComputedStyle(track).paddingLeft) || 0;
            track.scrollTo({
              left: cardLeft - trackPaddingLeft,
              behavior: 'smooth'
            });
          }
        };
      });

      // Update active dot on scroll
      let scrollTimer = null;
      track.addEventListener('scroll', () => {
        if (scrollTimer) clearTimeout(scrollTimer);
        scrollTimer = setTimeout(() => {
          const scrollPos = track.scrollLeft;
          const trackPaddingLeft = parseFloat(window.getComputedStyle(track).paddingLeft) || 0;
          let closestIndex = 0;
          let minDiff = Infinity;

          cards.forEach((card, index) => {
            const cardLeft = card.offsetLeft - trackPaddingLeft;
            const diff = Math.abs(scrollPos - cardLeft);
            if (diff < minDiff) {
              minDiff = diff;
              closestIndex = index;
            }
          });

          dots.forEach((dot, idx) => {
            if (idx === closestIndex) {
              dot.classList.add('active');
            } else {
              dot.classList.remove('active');
            }
          });
        }, 50);
      }, { passive: true });
    }

    function initTyping() {
      const el = $('#typing-text');
      if (!el) return;
      const targetText = t('잘 잤어?', 'よく眠れた？');
      let idx = 0;
      el.textContent = '';
      function typeNext() {
        if (idx <= targetText.length) {
          el.textContent = targetText.slice(0, idx);
          idx++;
          setTimeout(typeNext, 120);
        }
      }
      setTimeout(typeNext, 400);
    }

    // Initial render
    renderPage();
  </script>
